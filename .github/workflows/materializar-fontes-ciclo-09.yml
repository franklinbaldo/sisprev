name: Materializar fontes oficiais do Ciclo 9

on:
  push:
    branches:
      - agent/ciclo-09-fontes-historicas

permissions:
  contents: write

jobs:
  arquivar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e conferir publicações oficiais
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o fontes-oficiais/arquivos/sapl-LC1-1984.pdf 'https://sapl.al.ro.leg.br/media/sapl/public/normajuridica/1984/134/134_texto_integral.pdf'
          curl --fail --location --retry 3 -o fontes-oficiais/arquivos/ditel-LC1-COMPILADA.pdf 'https://ditel.casacivil.ro.gov.br/cotel/Livros/Files/LC1%20-%20COMPILADA.pdf'
          curl --fail --location --retry 3 -o fontes-oficiais/arquivos/sapl-LC39-1990.pdf 'https://sapl.al.ro.leg.br/media/sapl/public/normajuridica/1990/172/172_texto_integral.pdf'
          curl --fail --location --retry 3 -o fontes-oficiais/arquivos/ditel-LC68-COMPILADA.pdf 'https://ditel.casacivil.ro.gov.br/cotel/Livros/Files/LC68%20-%20COMPILADA.pdf'
          curl --fail --location --retry 3 -o fontes-oficiais/arquivos/ditel-LC228-COMPILADA.pdf 'https://ditel.casacivil.ro.gov.br/COTEL/Livros/Files/LC228%20-%20COMPILADA.pdf'
          curl --fail --location --retry 3 -o fontes-oficiais/arquivos/sapl-LC253-2002.pdf 'https://sapl.al.ro.leg.br/media/sapl/public/normajuridica/2002/386/386_texto_integral.pdf'
          sha256sum -c <<'SUMS'
          87f6478b74d708e4b7e24012d7e02997ca2e336cc44c1414ac794ecb775f9d91  fontes-oficiais/arquivos/sapl-LC1-1984.pdf
          47068d5e176ea7a076be67c38e1009271f4e6e294ea9a8dd12eedff83c5ed6b8  fontes-oficiais/arquivos/ditel-LC1-COMPILADA.pdf
          72a528e9be13736ab59477e6fa27609085fd807edce5f8a5d54f2270dea1d211  fontes-oficiais/arquivos/sapl-LC39-1990.pdf
          bbcf5ea271c6aa0370aa0c84e77e69fd67f8bce7e5d1c2359dd28cfb15e2df9d  fontes-oficiais/arquivos/ditel-LC68-COMPILADA.pdf
          96202c254931d379a5f3434ad7bca6ca240978a0c337c8cb72e27ccff2b1218d  fontes-oficiais/arquivos/ditel-LC228-COMPILADA.pdf
          4c331a32aa92f3136cb02902497d5f60f286d0c3e472a4e505724c8ba8e05512  fontes-oficiais/arquivos/sapl-LC253-2002.pdf
          SUMS
      - name: Versionar originais e retirar transportador temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fontes-oficiais/arquivos/*.pdf
          git rm .github/workflows/materializar-fontes-ciclo-09.yml
          git commit -m 'chore(ciclo-09): materializar publicacoes oficiais'
          git push
