name: Temporary patch PR 91 missing rules

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'cycle/1-operacionalizacao'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cycle/1-operacionalizacao
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
          enable-cache: true
      - run: uv sync --dev
      - name: Add missing-rule coverage criterion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          criterion = Path('docs/spec/criterio-fechamento-ciclos.md')
          text = criterion.read_text(encoding='utf-8')

          anchor = (
              'Não se deve reaproveitar o ID da regra errada para uma hipótese juridicamente\n'
              'diferente. Correções meramente formais que não alterem a identidade material da\n'
              'regra podem permanecer no mesmo ID, desde que essa conclusão seja expressamente\n'
              'registrada.\n'
          )
          addition = anchor + (
              '\n## Descoberta de regras ausentes\n\n'
              'A auditoria não se limita às hipóteses já representadas no catálogo legado. A\n'
              'matriz normativa pode revelar uma combinação juridicamente existente para a\n'
              'qual nunca houve regra cadastrada. Nesse caso, deve ser criada uma regra nova,\n'
              'com ID próprio, ainda que ela não substitua nenhuma regra anterior.\n\n'
              'Toda regra nova deve registrar sua origem material como uma destas categorias:\n\n'
              '- **substituição** — corrige hipótese existente representada defeituosamente por\n'
              '  uma regra desativada; ou\n'
              '- **lacuna preexistente** — cobre hipótese juridicamente existente que não tinha\n'
              '  antecedente no catálogo.\n\n'
              'Uma regra criada para lacuna preexistente deve apontar para a combinação da\n'
              'matriz que passou a cobrir, e não para uma regra legada artificialmente escolhida\n'
              'como antecessora.\n'
          )
          if '## Descoberta de regras ausentes' not in text:
              text = text.replace(anchor, addition)

          text = text.replace(
              'Para cada combinação juridicamente possível, a matriz deve identificar a regra\n'
              'ativa que a cobre. Combinações juridicamente impossíveis devem ser marcadas como\n'
              'impossíveis, com fundamento.\n',
              'Para cada combinação juridicamente possível, a matriz deve identificar a regra\n'
              'ativa que a cobre. Se nenhuma regra ativa a cobrir, a combinação constitui lacuna\n'
              'do catálogo e exige a criação de regra nova. Combinações juridicamente impossíveis\n'
              'devem ser marcadas como impossíveis, com fundamento.\n',
          )

          text = text.replace(
              '03. todas as combinações juridicamente relevantes estiverem cobertas por regras\n'
              '    ativas;\n'
              '04. não houver lacunas de cobertura;\n',
              '03. todas as combinações juridicamente relevantes estiverem cobertas por regras\n'
              '    ativas, inclusive as que não possuíam antecedente no catálogo legado;\n'
              '04. toda lacuna preexistente identificada tiver sido preenchida por regra nova\n'
              '    com ID próprio;\n'
              '05. não houver lacunas de cobertura;\n',
          )
          # Renumber the remaining list only once after inserting the new item.
          for old, new in [
              ('05. não houver sobreposições', '06. não houver sobreposições'),
              ('06. toda sobreposição', '07. toda sobreposição'),
              ('07. o mapa', '08. o mapa'),
              ('08. não houver pendência', '09. não houver pendência'),
              ('09. os cenários', '10. os cenários'),
              ('10. os artefatos', '11. os artefatos'),
          ]:
              text = text.replace(old, new)

          text = text.replace(
              '- as novas regras criadas;\n',
              '- as novas regras criadas, classificadas por origem como `substituição` ou\n'
              '  `lacuna preexistente`;\n',
          )
          text = text.replace(
              '- a matriz de cobertura completa;\n',
              '- a matriz de cobertura completa, inclusive as lacunas preexistentes descobertas\n'
              '  e as regras novas que passaram a cobri-las;\n',
          )
          criterion.write_text(text, encoding='utf-8', newline='\n')

          readme = Path('docs/spec/README.md')
          text = readme.read_text(encoding='utf-8')
          old = (
              'hipótese juridicamente inexistente, a desativação é registrada expressamente\n'
              'como `sem substituta`, com fundamento. Uma matriz final deve demonstrar a\n'
              'cobertura completa do tema, sem lacunas ou sobreposições injustificadas, e a\n'
              'sessão de fechamento exige zero pendências que afetem essa cobertura.\n'
          )
          new = (
              'hipótese juridicamente inexistente, a desativação é registrada expressamente\n'
              'como `sem substituta`, com fundamento. Hipóteses juridicamente existentes que\n'
              'nunca tiveram regra no catálogo recebem regras novas, classificadas como\n'
              '`lacuna preexistente`. Uma matriz final deve demonstrar a cobertura completa do\n'
              'tema, sem lacunas ou sobreposições injustificadas, e a sessão de fechamento\n'
              'exige zero pendências que afetem essa cobertura.\n'
          )
          text = text.replace(old, new)
          readme.write_text(text, encoding='utf-8', newline='\n')

          cycle = Path('okf/regras-sisprev/ciclos/ciclo-01.md')
          text = cycle.read_text(encoding='utf-8')

          text = text.replace(
              '7. a situação da regra no catálogo após a auditoria.\n',
              '7. a situação da regra no catálogo após a auditoria; e\n'
              '8. as hipóteses juridicamente existentes que não possuem nenhuma regra no\n'
              '   catálogo atual.\n',
          )
          text = text.replace(
              'registrada como `sem substituta`, com fundamento.\n',
              'registrada como `sem substituta`, com fundamento. Hipóteses juridicamente\n'
              'existentes sem qualquer antecedente no catálogo recebem regras novas, com IDs\n'
              'próprios, classificadas como `lacuna preexistente`.\n',
              1,
          )
          premise = (
              '13. **O objeto final é o conjunto ativo.** Nenhuma regra materialmente errada\n'
              '    permanece ativa. Hipótese existente representada de modo defeituoso recebe\n'
              '    regra nova com ID próprio; hipótese juridicamente inexistente é desativada\n'
              '    com o registro `sem substituta`, sem criação artificial de regra.\n'
          )
          premise_new = premise + (
              '14. **Cobertura não se limita ao legado.** Se a matriz revelar hipótese\n'
              '    juridicamente existente nunca representada no catálogo, deve ser criada regra\n'
              '    nova com ID próprio e origem `lacuna preexistente`, sem antecessora artificial.\n'
          )
          if '14. **Cobertura não se limita ao legado.**' not in text:
              text = text.replace(premise, premise_new)

          t4_end = (
              'disposição expressa” não são resultados de encerramento.\n'
          )
          t5 = t4_end + (
              '\n### T5 — Detecção e criação de regras ausentes\n\n'
              'A avaliação dos blocos não parte da presunção de que as regras legadas esgotam o\n'
              'tema. Para cada combinação juridicamente possível da matriz de cobertura, deve-se\n'
              'verificar se existe regra ativa suficiente. Quando não existir, o próprio bloco\n'
              'proprietário cria regra nova com ID próprio e registra a origem\n'
              '`lacuna preexistente`.\n\n'
              'A regra nova por lacuna não integra o mapa de substituições. Ela integra um\n'
              'inventário separado `combinação descoberta → regra nova`, com fonte e fundamento.\n'
          )
          if '### T5 — Detecção e criação de regras ausentes' not in text:
              text = text.replace(t4_end, t5)

          text = text.replace(
              '- Saída obrigatória: matriz inicial preenchida e mapa\n'
              '  `regra → achados → fontes → lacunas`.\n',
              '- Saída obrigatória: matriz inicial preenchida, mapa\n'
              '  `regra → achados → fontes → lacunas` e inventário inicial de combinações sem\n'
              '  regra correspondente.\n',
          )
          text = text.replace(
              '- Critério de saída: cada regra possui classes de causa possíveis e resultado\n'
              '  admissível definido, sem editar ainda o mérito histórico.\n',
              '- Critério de saída: cada regra possui classes de causa possíveis e resultado\n'
              '  admissível definido; T5 fixa como detectar e registrar hipóteses sem regra, sem\n'
              '  editar ainda o mérito histórico.\n',
          )

          for block_line in [
              'Saída do bloco: matriz de aplicabilidade histórica e decisão individual sobre as\n'
              'três regras, sem presumir que regra antiga deva permanecer ativa apenas porque a\n'
              'redação existiu no passado.\n',
              'Saída do bloco: pares geral/transição com fundamentação compatível com o ramo\n'
              'integral ou proporcional e com a classe de causa representada.\n',
              'Saída do bloco: regras pós-reforma coerentes quanto a ingresso, causa, cálculo,\n'
              'paridade, fundamentação e dispositivos.\n',
          ]:
              if block_line in text and 'lacunas preexistentes' not in block_line:
                  replacement = block_line.rstrip('\n') + (
                      ' O bloco também deve criar as regras necessárias para lacunas preexistentes\n'
                      'que identificar em seu regime.\n'
                  )
                  text = text.replace(block_line, replacement)

          text = text.replace(
              '- Escopo: comparar os três blocos, formas de cálculo, classes de causa,\n'
              '  fronteiras e dispositivos; inventariar todas as pendências deixadas por S2,\n'
              '  S3 e S4; e dar disposição a cada uma.\n',
              '- Escopo: comparar os três blocos, formas de cálculo, classes de causa,\n'
              '  fronteiras e dispositivos; inventariar todas as pendências deixadas por S2,\n'
              '  S3 e S4; dar disposição a cada uma; e verificar se a matriz contém combinação\n'
              '  juridicamente possível ainda sem regra ativa.\n',
          )
          text = text.replace(
              '- Saída obrigatória: correção de inconsistências entre sessões, matriz final\n'
              '  consolidada e registro de zero pendências que afetem cobertura.\n',
              '- Saída obrigatória: correção de inconsistências entre sessões, matriz final\n'
              '  consolidada, inventário `combinação descoberta → regra nova` e registro de zero\n'
              '  pendências ou lacunas que afetem cobertura.\n',
          )
          text = text.replace(
              '- Saída obrigatória: PR final com resumo por regra, mapa de substituições e de\n'
              '  desativações sem substituta, matriz de cobertura, fontes, riscos residuais e\n'
              '  CI verde.\n',
              '- Saída obrigatória: PR final com resumo por regra, mapa de substituições e de\n'
              '  desativações sem substituta, inventário das regras novas por lacuna\n'
              '  preexistente, matriz de cobertura, fontes, riscos residuais e CI verde.\n',
          )
          text = text.replace(
              '5. Descoberta transversal durante um bloco é registrada imediatamente, mas sua\n'
              '   harmonização global pertence à S5, salvo quando a correção é indispensável\n'
              '   para não autorar uma regra sabidamente errada.\n',
              '5. Descoberta transversal ou hipótese sem regra durante um bloco é registrada\n'
              '   imediatamente. A regra nova para lacuna material pertence ao bloco do regime;\n'
              '   a harmonização global pertence à S5.\n',
          )
          text = text.replace(
              '- [ ] Fixar o vocabulário e o teste de materialidade de T3.\n'
              '- [ ] Registrar a forma de resultado de T4.\n',
              '- [ ] Fixar o vocabulário e o teste de materialidade de T3.\n'
              '- [ ] Registrar a forma de resultado de T4.\n'
              '- [ ] Registrar o método de detecção e criação de regras ausentes de T5.\n',
          )
          text = text.replace(
              '- [ ] Consolidar a matriz final de cobertura e as combinações juridicamente\n'
              '  impossíveis.\n',
              '- [ ] Consolidar a matriz final de cobertura e as combinações juridicamente\n'
              '  impossíveis.\n'
              '- [ ] Criar todas as regras necessárias para combinações juridicamente possíveis\n'
              '  sem antecedente no catálogo e registrar o inventário\n'
              '  `combinação descoberta → regra nova`.\n',
          )
          text = text.replace(
              '2. regras corretas mantidas ou criadas e regras materialmente erradas\n'
              '   desativadas;\n',
              '2. regras corretas mantidas ou criadas — por substituição ou por lacuna\n'
              '   preexistente — e regras materialmente erradas desativadas;\n',
          )
          text = text.replace(
              '4. matriz final de cobertura, com combinações impossíveis fundamentadas;\n',
              '4. inventário `combinação descoberta → regra nova` para lacunas preexistentes;\n'
              '5. matriz final de cobertura, com combinações impossíveis fundamentadas;\n',
          )
          # Renumber deliverables after inserted item.
          for old, new in [
              ('5. novos dispositivos', '6. novos dispositivos'),
              ('6. achados autorais', '7. achados autorais'),
              ('7. registro de zero', '8. registro de zero'),
              ('8. artefatos derivados', '9. artefatos derivados'),
              ('9. CI integralmente', '10. CI integralmente'),
          ]:
              text = text.replace(old, new)

          result_anchor = (
              '- [ ] `regra-0022` — situação; decisão; alterações; fontes; pendências/achados.\n'
          )
          result_new = result_anchor + (
              '\n### Regras novas sem antecedente legado\n\n'
              'Preencher para cada lacuna preexistente identificada:\n\n'
              '- [ ] combinação jurídica descoberta; regra nova; bloco proprietário; fontes;\n'
              '  fundamento da ausência no catálogo anterior.\n'
          )
          if '### Regras novas sem antecedente legado' not in text:
              text = text.replace(result_anchor, result_new)

          conclusion_anchor = (
              '- [ ] A matriz demonstra cobertura completa das combinações juridicamente\n'
              '  relevantes e fundamenta as combinações impossíveis.\n'
          )
          conclusion_new = conclusion_anchor + (
              '- [ ] Toda combinação juridicamente possível sem antecedente no catálogo recebeu\n'
              '  regra nova com ID próprio e origem `lacuna preexistente`.\n'
              '- [ ] O inventário `combinação descoberta → regra nova` está completo.\n'
          )
          if 'origem `lacuna preexistente`' not in text[text.find('## Conclusão do ciclo'):]:
              text = text.replace(conclusion_anchor, conclusion_new)

          cycle.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Format markdown
        run: uv run python scripts/md_format.py docs/spec/criterio-fechamento-ciclos.md docs/spec/README.md okf/regras-sisprev/ciclos/ciclo-01.md
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Missing-rule criterion already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec/criterio-fechamento-ciclos.md docs/spec/README.md okf/regras-sisprev/ciclos/ciclo-01.md
          git commit -m "docs: require creation of uncovered rules"
          git push origin HEAD:cycle/1-operacionalizacao
