name: Visual capture

on:
  pull_request:
    paths:
      - "site/**"
      - "okf/**"
      - "docs/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/visual-capture.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "okf/**"
      - "docs/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/visual-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.7.19"
          enable-cache: true

      - run: uv sync --dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Emit site data
        run: ./site/scripts/emit-data.sh

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build the same Astro artifact used by Pages
        working-directory: site
        run: npm run build

      - name: Install Chromium for deterministic capture
        working-directory: site
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve the Project Pages artifact under /sisprev/
        run: |
          set -euo pipefail
          mkdir -p .capture-root/sisprev
          cp -a site/dist/. .capture-root/sisprev/
          python -m http.server 4173 --directory .capture-root > /tmp/sisprev-capture-server.log 2>&1 &
          echo $! > /tmp/sisprev-capture-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/sisprev/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sisprev-capture-server.log
          exit 1

      - name: Capture and verify dense browser surfaces
        working-directory: site
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:4173/sisprev/
          EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_REF_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          CAPTURE_PHASE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'main' }}
        run: node scripts/capture-visual.mjs

      - name: Verify produced evidence files
        if: always()
        run: |
          set -euo pipefail
          test -s visual-evidence/home-1280x900.png
          test -s visual-evidence/home-390x844.png
          test -s visual-evidence/relatorio-1280x900.png
          test -s visual-evidence/relatorio-390x844.png
          test -s visual-evidence/evidence.json

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sisprev-rendered-surfaces-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/*
          retention-days: 14
          if-no-files-found: error
