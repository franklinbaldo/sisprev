name: Temporary patch PR 91 review fixes

on:
  push:
    branches:
      - cycle/1-operacionalizacao

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cycle/1-operacionalizacao
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
          enable-cache: true
      - run: uv sync --dev
      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("okf/regras-sisprev/ciclos/ciclo-01.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "> **Estado:** planejado. Este arquivo é simultaneamente o plano, o diário de\n"
              "> decisões e o relatório final do ciclo.",
              "> **Estado:** pronto para execução. Este arquivo é simultaneamente o plano, o\n"
              "> diário de decisões e o relatório final do ciclo.",
          )

          product = (
              "O produto não é uma nova análise paralela. O produto é o próprio catálogo\n"
              "corrigido, os achados autorais necessários e o resultado consolidado neste\n"
              "arquivo.\n"
          )
          product_new = product + (
              "\nO ciclo só termina quando o conjunto de regras ativas estiver juridicamente\n"
              "correto e cobrir integralmente o tema. Regras materialmente erradas são\n"
              "desativadas. Se a hipótese jurídica continuar existindo, ela recebe regra ou\n"
              "regras novas; se a hipótese for juridicamente inexistente, a desativação é\n"
              "registrada como `sem substituta`, com fundamento.\n"
          )
          text = text.replace(product, product_new)

          premise = (
              "12. **`DATA_ADM_APOS` é inclusivo.** O campo representa a fronteira inferior do\n"
              "    ingresso no serviço público; para cargo efetivo, o marco jurídico é a posse.\n"
          )
          premise_new = premise + (
              "13. **O objeto final é o conjunto ativo.** Nenhuma regra materialmente errada\n"
              "    permanece ativa. Hipótese existente representada de modo defeituoso recebe\n"
              "    regra nova com ID próprio; hipótese juridicamente inexistente é desativada\n"
              "    com o registro `sem substituta`, sem criação artificial de regra.\n"
          )
          text = text.replace(premise, premise_new)

          old_t4 = '''### T4 — Resultado admissível por regra

Cada regra deve terminar o ciclo em exatamente uma destas situações:

- **conferida sem alteração**;
- **corrigida**;
- **inativada com conclusão, justificativa e substituição identificável**; ou
- **pendente por dependência externa**, com a pergunta, a evidência faltante, o
  responsável pela obtenção e o efeito preciso sobre a regra.

“Não analisada” ou “parece correta” não são resultados de encerramento.
'''
          new_t4 = '''### T4 — Resultado admissível por regra e cobertura final

Durante a execução, cada regra recebe exatamente uma destas situações:

- **conferida sem alteração**;
- **corrigida e mantida ativa**, quando a correção não altera sua identidade
  material;
- **desativada e substituída**, quando representava defeituosamente hipótese
  jurídica que continua existindo;
- **desativada sem substituta**, quando representava hipótese juridicamente
  inexistente, com fundamento expresso; ou
- **pendente por dependência externa**, com a pergunta, a evidência faltante, o
  responsável pela obtenção e o efeito preciso sobre a regra.

A situação pendente é intermediária. Ela não pode chegar ao fechamento quando
impedir afirmar cobertura completa, ausência de lacuna ou ausência de
sobreposição injustificada. “Não analisada”, “parece correta” e “desativada sem
disposição expressa” não são resultados de encerramento.
'''
          text = text.replace(old_t4, new_t4)

          old_s5 = '''### S5 — Consistência transversal

- Branch sugerida: `cycle/1-s5-consistencia`.
- Escopo: comparar os três blocos, formas de cálculo, classes de causa,
  fronteiras e dispositivos.
- Saída obrigatória: correção de inconsistências introduzidas entre sessões e
  matriz final consolidada.
- Critério de saída: a mesma hipótese material recebe tratamento compatível em
  todos os regimes ou a divergência fica expressamente justificada.
'''
          new_s5 = '''### S5 — Consistência transversal e resolução de pendências

- Branch sugerida: `cycle/1-s5-consistencia`.
- Escopo: comparar os três blocos, formas de cálculo, classes de causa,
  fronteiras e dispositivos; inventariar todas as pendências deixadas por S2,
  S3 e S4; e dar disposição a cada uma.
- Saída obrigatória: correção de inconsistências entre sessões, matriz final
  consolidada e registro de zero pendências que afetem cobertura.
- Critério de saída: a mesma hipótese material recebe tratamento compatível em
  todos os regimes ou a divergência fica expressamente justificada; toda
  pendência de cobertura é resolvida em S5 ou devolvida, com reabertura, à sessão
  proprietária da regra ou do bloco.
'''
          text = text.replace(old_s5, new_s5)

          old_s6 = '''### S6 — Fechamento

- Branch sugerida: `cycle/1-s6-fechamento`.
- Escopo: regenerar derivados, executar gates, preencher a conclusão e encerrar o
  ciclo.
- Saída obrigatória: PR final com resumo por regra, fontes, riscos residuais e CI
  verde.
- Critério de saída: checklist de conclusão integralmente tratado e issue #89
  pronta para encerramento.
'''
          new_s6 = '''### S6 — Fechamento

- Branch sugerida: `cycle/1-s6-fechamento`.
- Gate de entrada: zero pendências abertas que afetem a cobertura material do
  tema. Se o gate falhar, o trabalho retorna obrigatoriamente a S5 ou à sessão
  proprietária correspondente.
- Escopo: regenerar derivados, executar gates, preencher a conclusão e encerrar o
  ciclo.
- Saída obrigatória: PR final com resumo por regra, mapa de substituições e de
  desativações sem substituta, matriz de cobertura, fontes, riscos residuais e
  CI verde.
- Critério de saída: nenhuma regra errada permanece ativa; toda desativação tem
  substituição ou registro fundamentado de `sem substituta`; a matriz demonstra
  cobertura completa sem lacunas ou sobreposições injustificadas; e o checklist
  está integralmente tratado.
'''
          text = text.replace(old_s6, new_s6)

          order = (
              "4. Questão externa localizada não paralisa a sessão inteira: a regra afetada é\n"
              "   marcada como pendente e as demais continuam.\n"
              "5. Descoberta transversal durante um bloco é registrada imediatamente, mas sua\n"
              "   harmonização global pertence à S5, salvo quando a correção é indispensável\n"
              "   para não autorar uma regra sabidamente errada.\n"
          )
          order_new = order + (
              "6. S5 é responsável por inventariar e dar disposição às pendências dos blocos.\n"
              "   O que não puder resolver transversalmente retorna à sessão proprietária.\n"
              "7. S6 só começa após o registro explícito de zero pendências que afetem\n"
              "   cobertura.\n"
          )
          text = text.replace(order, order_new)

          phase5 = (
              "### Fase 5 — consolidar o catálogo\n\n"
              "- [ ] Editar apenas os arquivos OKF autorais correspondentes.\n"
          )
          phase5_new = (
              "### Fase 5 — consolidar o catálogo\n\n"
              "- [ ] Inventariar todas as pendências deixadas pelos blocos e resolvê-las em\n"
              "  S5 ou devolvê-las à sessão proprietária.\n"
              "- [ ] Registrar zero pendências que afetem cobertura antes de abrir S6.\n"
              "- [ ] Consolidar o mapa\n"
              "  `regra desativada → regra(s) substituta(s) | sem substituta fundamentada`.\n"
              "- [ ] Consolidar a matriz final de cobertura e as combinações juridicamente\n"
              "  impossíveis.\n"
              "- [ ] Editar apenas os arquivos OKF autorais correspondentes.\n"
          )
          text = text.replace(phase5, phase5_new)

          phase6 = (
              "### Fase 6 — validar e encerrar\n\n"
              "- [ ] Regenerar artefatos com `uv run python scripts/gerar_indices.py`.\n"
          )
          phase6_new = (
              "### Fase 6 — validar e encerrar\n\n"
              "- [ ] Confirmar o gate de entrada: zero pendências que afetem cobertura.\n"
              "- [ ] Regenerar artefatos com `uv run python scripts/gerar_indices.py`.\n"
          )
          text = text.replace(phase6, phase6_new)

          deliverable = '''1. este arquivo preenchido com decisões e resultados;
2. regras corrigidas ou justificadamente mantidas;
3. novos dispositivos apenas quando indispensáveis e conferidos em fonte
   primária;
4. achados autorais novos ou atualizados, sem duplicação;
5. artefatos derivados sincronizados; e
6. CI integralmente verde.
'''
          deliverable_new = '''1. este arquivo preenchido com decisões e resultados;
2. regras corretas mantidas ou criadas e regras materialmente erradas
   desativadas;
3. mapa completo
   `regra desativada → regra(s) substituta(s) | sem substituta fundamentada`;
4. matriz final de cobertura, com combinações impossíveis fundamentadas;
5. novos dispositivos apenas quando indispensáveis e conferidos em fonte
   primária;
6. achados autorais novos ou atualizados, sem duplicação;
7. registro de zero pendências que afetem cobertura;
8. artefatos derivados sincronizados; e
9. CI integralmente verde.
'''
          text = text.replace(deliverable, deliverable_new)

          text = text.replace(
              "Preencher cada linha com uma das situações de T4 e resumir: decisão, alterações,\n"
              "fontes, achados e dependências.\n",
              "Preencher cada linha com uma das situações de T4 e resumir: decisão, alterações,\n"
              "fontes, achados, dependências e, quando desativada, as substitutas ou o registro\n"
              "fundamentado de `sem substituta`.\n",
          )

          conclusion = (
              "- [ ] Todas as regras proprietárias receberam uma situação final de T4.\n"
          )
          conclusion_new = conclusion + (
              "- [ ] Nenhuma regra materialmente errada permanece ativa.\n"
              "- [ ] Toda regra desativada possui substituta suficiente ou registro\n"
              "  fundamentado de `sem substituta — hipótese juridicamente inexistente`.\n"
              "- [ ] A matriz demonstra cobertura completa das combinações juridicamente\n"
              "  relevantes e fundamenta as combinações impossíveis.\n"
              "- [ ] Toda sobreposição foi eliminada ou expressamente justificada.\n"
              "- [ ] Não existe pendência aberta que afete cobertura.\n"
          )
          text = text.replace(conclusion, conclusion_new)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format markdown
        run: uv run python scripts/md_format.py okf/regras-sisprev/ciclos/ciclo-01.md
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No review fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add okf/regras-sisprev/ciclos/ciclo-01.md
          git commit -m "docs: address PR 91 coverage review"
          git push origin HEAD:cycle/1-operacionalizacao
