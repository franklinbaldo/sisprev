name: CI

# Um job, uma guarda por linha.
#
# Cada um protege algo que quebra em silêncio: um bundle malformado, um CSV
# comitado à mão que não é o que o bundle produz, a linha de base da auditoria
# reescrita, um achado apagado. Nenhum deles julga o mérito de uma regra — a
# conferência jurídica é trabalho humano, escrita nos `.md`, e o CI não tem
# competência para opinar sobre ela.
#
# O que ficou de fora ficou de propósito: formatação de markdown e estilo de
# Python não têm incidente por trás, e gate sem incidente é o que produziu a
# infraestrutura que este arquivo substitui. Guarda nova aqui exige um caso
# concreto que já tenha acontecido.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # a guarda de achado append-only precisa do histórico inteiro para achar o merge-base
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync

      # Cada diretório sob okf/ é um bundle com raiz própria — só a raiz pode
      # carregar frontmatter no index.md, então o check é por bundle.
      - name: bundles conformes com a spec OKF
        run: for b in okf/*/; do uv run okf-parser check "$b"; done

      # O CSV que o Sisprev consome e as duas listagens têm de ser exatamente o
      # que o bundle atual regenera. Um derivado divergente é a pior falha do
      # repositório porque parece dado bom. `derivar.py` também levanta se a
      # identidade dos documentos não fechar com o Dataset.
      - name: artefatos derivados em sincronia
        run: |
          uv run python scripts/derivar.py
          git diff --exit-code data/regras-sisprev.csv okf/regras-sisprev/regras/index.md okf/regras-sisprev/achados/index.md

      # `data/raw/` é o que foi recebido, como foi recebido. O bundle diverge
      # dela com o tempo — é esse o trabalho. O que nunca pode acontecer é a
      # linha de base ser reescrita por código: por `derivar.py`, por um script
      # de conversão, por conveniência de quem mexe no bundle.
      #
      # O teste disso já foi "cada arquivo tem exatamente um commit", e essa
      # regra proibia demais: a fonte mandou uma remessa nova com a coluna `ID`,
      # que a primeira não tinha, e o único jeito de recebê-la seria reescrever
      # a história de `main`. O que a substitui é recebimento novo da fonte, e é
      # ato humano — o que o gate tem de exigir é que o ato seja deliberado e
      # apareça na revisão, não que seja impossível.
      #
      # Daí o manifesto: mexer num arquivo de `data/raw/` obriga a reescrever o
      # `SHA256SUMS` no mesmo commit, e o diff mostra a linha de base mudando.
      # Uma escrita acidental continua derrubando o CI, que é o que se quer.
      - name: importação congelada confere com o manifesto
        run: cd data/raw && sha256sum -c SHA256SUMS

      # Um `type` podia existir, ser usado por centenas de documentos e nunca
      # ter contrato escrito: o esquema dele passava a viver em quem o
      # implementa — o `content.config.ts` do site — e mudava sem que nada
      # acusasse. Numa única sessão o contrato de `Conjunto` ganhou
      # `substituicoes` e o de `Ciclo` ganhou `conjunto`, e nenhum dos dois
      # tinha documento. A regra é a de okf-parser#25, com o caminho da spec
      # derivado do nome do tipo; quando o parser a implementar, o script sai.
      - name: todo type em uso tem documento de especificação
        run: uv run python scripts/conferir_specs_dos_tipos.py

      # Uma decisão da coordenação valia nos documentos e não valia no dado. As
      # vinte unidades da coorte posterior a 2003 gravaram a fronteira de
      # ingresso pela convenção oposta à que a spec fixa, e as guardas acima
      # passaram todas —
      # bundle conforme, derivado em sincronia, importação íntegra. O defeito
      # estava num campo que decide qual regra alcança um requerimento, e o
      # único jeito de encontrá-lo era comparar o catálogo com a decisão à mão.
      #
      # O script não sabe nada sobre janelas temporais: lê a decisão declarada
      # na própria spec e compara. Mudou a decisão, muda-se a spec.
      - name: catálogo proposto confere com as decisões declaradas nas specs
        run: uv run python scripts/conferir_decisoes_da_spec.py

      # E o caminho infeliz, porque um gate que só se exercita quando passa não
      # está sendo exercitado: apontado para uma árvore sem declaração alguma,
      # ele tem de reprovar. Sem isto, apagar o frontmatter da spec desligaria
      # a conferência anterior em silêncio — que é a própria regressão que ela
      # existe para pegar.
      - name: o gate reprova quando a declaração some
        run: |
          if uv run python scripts/conferir_decisoes_da_spec.py --raiz "$(mktemp -d)"; then
            echo "O gate passou sem declaração alguma; ele não está protegendo nada."
            exit 1
          fi

      # Um achado é uma acusação datada sobre regras nomeadas, e outros
      # documentos o citam pelo id. Apagar ou renumerar reescreve o passado da
      # auditoria e deixa citação apontando para coisa nenhuma. Achado errado
      # se marca `improcedente`; não se apaga.
      #
      # A garantia vale a partir do instante em que o achado chega a `main` —
      # não antes. Comparar contra a história inteira da branch, como este
      # gate fazia, fossilizava também achado criado e removido dentro da
      # mesma PR ainda não mergeada, que nunca chegou a ser registro
      # institucional (`achado-0061`, PR #128, corrigido junto com este
      # comentário). Por isso a comparação é contra o merge-base com a branch
      # de destino — a foto de `main` no ponto em que a PR partiu dela —, não
      # contra commits internos da branch.
      - name: id de achado é append-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            base="${{ github.event.before }}"
          fi
          status=0
          for path in $(git diff --diff-filter=D --name-only "$base" -- 'okf/regras-sisprev/achados/achado-*.md'); do
            echo "$path existia em $base e não está mais no repositório."
            status=1
          done
          exit $status
