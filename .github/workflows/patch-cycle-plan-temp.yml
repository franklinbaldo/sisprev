name: Temporary patch cycle 1 operational plan

on:
  push:
    branches:
      - cycle/1-operacionalizacao

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cycle/1-operacionalizacao
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
          enable-cache: true
      - run: uv sync --dev
      - name: Patch operational plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("okf/regras-sisprev/ciclos/ciclo-01.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "> **Estado:** planejado. Este arquivo é simultaneamente o plano, o diário de\n"
              "> decisões e o relatório final do ciclo.",
              "> **Estado:** pronto para execução. Este arquivo é simultaneamente o plano, o\n"
              "> diário de decisões e o relatório final do ciclo.",
          )
          text = text.replace(
              "- Data de abertura prevista: 01/08/2026\n",
              "- Data de abertura operacional: 01/08/2026\n",
          )
          text = text.replace(
              "- Commit de origem: `e17b6e45af763160e70aa6f259d2f98c8ffd08e6`\n",
              "- Commit de origem do planejamento: `e17b6e45af763160e70aa6f259d2f98c8ffd08e6`\n"
              "- Commit de planejamento consolidado: `27327c15140f30344c366fc5b6e66974a5f93e4f`\n"
              "- Commit-base operacional: `732a951b813762784bb160a264ef1060690580fd`\n",
          )

          marker = "## Fluxo processual\n"
          operational = r'''## Estratégia de execução por sessões

O ciclo será executado em sessões sequenciais e pequenas. Cada sessão parte da
`main` resultante da sessão anterior, entrega uma PR revisável e atualiza este
arquivo. Não serão mantidas PRs paralelas que editem a mesma regra, o mesmo
achado ou o mesmo dispositivo.

A divisão não cria relatórios paralelos. A issue #89 rastreia links e estado; as
decisões, fontes e resultados continuam registrados neste arquivo e nos concepts
autorais diretamente afetados.

| Sessão | Branch sugerida | Escopo | Saída obrigatória | Critério de saída |
| ------ | --------------- | ------ | ----------------- | ----------------- |
| S0 — linha de base | `cycle/1-s0-linha-de-base` | Inventariar as 11 regras, achados, dispositivos, formas de cálculo e fontes já disponíveis, sem decidir mérito. | Matriz inicial preenchida e mapa `regra → achados → fontes → lacunas`. | Nenhuma regra permanece sem população de achados e sem lista de fontes a conferir. |
| S1 — causa e resultado | `cycle/1-s1-causa-resultados` | Fechar T3 e T4: vocabulário de causa, teste de materialidade da decomposição e forma de registrar o resultado final. | Decisão transversal escrita neste arquivo e matriz de decomposição por regime. | Cada regra possui classes de causa possíveis e resultado admissível definido, sem editar ainda o mérito histórico. |
| S2 — Bloco A | `cycle/1-s2-bloco-a` | Auditar `regra-0001`, `regra-0002` e `regra-0004`; consultar `regra-0003` e `regra-0005` apenas como referências. | Decisão individual, correções autorais, dispositivos e achados estritamente necessários. | As três regras recebem situação T4 ou dependência localizada com dono e efeito. |
| S3 — Bloco B | `cycle/1-s3-bloco-b` | Auditar `regra-0006` a `regra-0009` sob EC 41/2003, EC 70/2012 e LCE 432/2008. | Pares geral/transição coerentes quanto a causa, ramo, cálculo, reajuste e citação. | As quatro regras recebem situação T4; nenhuma citação incompatível permanece sem disposição. |
| S4 — Bloco C | `cycle/1-s4-bloco-c` | Auditar `regra-0019` a `regra-0022` sob EC 103/2019 e LCE 1.100/2021. | Regras pós-reforma coerentes, inclusive quanto ao marco de 2021 e às classes de causa. | As quatro regras recebem situação T4; dependências reais ficam individualizadas. |
| S5 — consistência transversal | `cycle/1-s5-consistencia` | Comparar os três blocos, formas de cálculo, classes de causa, fronteiras e dispositivos. | Correção de inconsistências introduzidas entre sessões e matriz final consolidada. | Mesma hipótese material recebe tratamento compatível em todos os regimes ou divergência expressamente justificada. |
| S6 — fechamento | `cycle/1-s6-fechamento` | Regenerar derivados, executar gates, preencher conclusão e encerrar o ciclo. | PR final com resumo por regra, fontes, riscos residuais e CI verde. | Checklist de conclusão integralmente tratado e issue #89 pronta para encerramento. |

### Ordem e dependências

1. S0 e S1 são obrigatoriamente sequenciais.
2. S2, S3 e S4 também serão sequenciais, porque compartilham vocabulário de
   causa, formas de cálculo, dispositivos e espaço de novos IDs.
3. Uma sessão só começa depois do merge da anterior. PR empilhada exige motivo
   explícito e não pode editar concepts já tocados pela PR-base.
4. Questão externa localizada não paralisa a sessão inteira: a regra afetada é
   marcada como pendente e as demais continuam.
5. Descoberta transversal durante um bloco é registrada imediatamente, mas sua
   harmonização global pertence à S5, salvo quando a correção é indispensável
   para não autorar uma regra sabidamente errada.

### Contrato mínimo de cada sessão

Toda sessão deve:

- declarar no início o commit-base e os concepts proprietários;
- ler integralmente as specs dos tipos que editará;
- conferir se já existe achado para a unidade de investigação;
- separar fato mecânico, interpretação jurídica e decisão autoral;
- atualizar este arquivo no mesmo PR, sem deixar conclusão apenas em comentário;
- relacionar fontes primárias efetivamente abertas;
- regenerar derivados somente quando houver alteração de concept que os afete;
- executar os gates aplicáveis antes do merge; e
- registrar o commit de fechamento e a PR na tabela de sessões.

Uma PR de bloco pode editar apenas:

- as regras proprietárias daquela sessão;
- dispositivos e formas de cálculo necessários para fundamentá-las;
- achados que efetivamente alcancem essas regras;
- este arquivo de ciclo; e
- artefatos derivados produzidos pelos scripts oficiais.

Referências de outro ciclo permanecem somente leitura, salvo ampliação de escopo
expressa neste arquivo antes da edição.

## Registro das sessões

| Sessão | Estado | PR | Commit-base | Commit de fechamento | Observação |
| ------ | ------ | -- | ----------- | -------------------- | ---------- |
| S0 | não iniciada | — | — | — | Linha de base e inventário. |
| S1 | não iniciada | — | — | — | T3, T4 e teste de materialidade. |
| S2 | não iniciada | — | — | — | Bloco A. |
| S3 | não iniciada | — | — | — | Bloco B. |
| S4 | não iniciada | — | — | — | Bloco C. |
| S5 | não iniciada | — | — | — | Consistência transversal. |
| S6 | não iniciada | — | — | — | Fechamento. |

'''
          if "## Estratégia de execução por sessões" not in text:
              text = text.replace(marker, operational + marker)

          text = text.replace(
              "- [ ] Registrar o commit efetivamente usado para iniciar a execução.\n",
              "- [ ] Registrar `732a951b813762784bb160a264ef1060690580fd` como commit-base da S0.\n",
          )

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format markdown
        run: uv run python scripts/md_format.py okf/regras-sisprev/ciclos/ciclo-01.md
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Plan already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add okf/regras-sisprev/ciclos/ciclo-01.md
          git commit -m "docs: operationalize cycle 1 sessions"
          git push origin HEAD:cycle/1-operacionalizacao
