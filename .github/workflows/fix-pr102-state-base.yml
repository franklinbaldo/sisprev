name: Fix PR 102 state-law base

on:
  push:
    branches:
      - feat/fundamentacao-tres-partes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/fundamentacao-tres-partes
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply reviewed legal corrections
        run: |
          uv run python - <<'PY'
          from io import StringIO
          from pathlib import Path

          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import FoldedScalarString

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 88

          def split_doc(path: Path):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise ValueError(path)
              _, frontmatter, body = text.split("---", 2)
              return yaml.load(frontmatter), body

          def write_doc(path: Path, data, body: str):
              out = StringIO()
              yaml.dump(data, out)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(f"---\n{out.getvalue()}---{body}", encoding="utf-8")

          # 1. A regra de autoria não cria, por si, ônus probatório.
          spec_path = Path("docs/spec/regra.md")
          spec = spec_path.read_text(encoding="utf-8")
          old = (
              "   exigida. Em ramo residual, a demonstração **negativa** das hipóteses\n"
              "   qualificadas é requisito e entra como tal;"
          )
          new = (
              "   exigida. Quando o predicado e o protocolo estruturados exigirem a\n"
              "   exclusão das hipóteses qualificadas, essa demonstração **negativa**\n"
              "   entra como requisito satisfeito;"
          )
          if old not in spec:
              raise ValueError("trecho da spec não encontrado")
          spec_path.write_text(spec.replace(old, new), encoding="utf-8")

          # 2. A ontologia passa a representar a base efetivamente definida pelos estatutos.
          schema_path = Path("scripts/forma_calculo_schema.py")
          schema = schema_path.read_text(encoding="utf-8")
          anchor = '    "totalidade_remuneracao_cargo_efetivo",\n'
          addition = '    "vencimento_cargo_acrescido_vantagens_pecuniarias",\n'
          if addition not in schema:
              if anchor not in schema:
                  raise ValueError("âncora de BaseTipo não encontrada")
              schema = schema.replace(anchor, anchor + addition, 1)
          schema_path.write_text(schema, encoding="utf-8")

          # 3. Dispositivos estaduais que definem a base.
          Path("okf/dispositivos/lce-39-1990/art-156/original.md").parent.mkdir(
              parents=True, exist_ok=True
          )
          Path("okf/dispositivos/lce-39-1990/art-156/original.md").write_text(
              """---
          type: Dispositivo
          id: lce-39-1990/art-156/original
          norma: lce-39-1990
          componentes:
            - tipo: artigo
              valor: '156'
              vigencia_inicio: '1990-07-31'
              vigencia_fim: '1992-12-08'
          vigencia_inicio: '1990-07-31'
          vigencia_fim: '1992-12-08'
          fontes:
            - https://sapl.al.ro.leg.br/media/sapl/public/normajuridica/1990/172/172_texto_integral.pdf
          ---

          Art. 156. O cálculo dos proventos terá por base o vencimento do cargo acrescido de gratificação adicional por tempo de serviço e outras vantagens pecuniárias.
          """.replace("          ", ""),
              encoding="utf-8",
          )
          Path("okf/dispositivos/lce-68-1992/art-236/original.md").parent.mkdir(
              parents=True, exist_ok=True
          )
          Path("okf/dispositivos/lce-68-1992/art-236/original.md").write_text(
              """---
          type: Dispositivo
          id: lce-68-1992/art-236/original
          norma: lce-68-1992
          componentes:
            - tipo: artigo
              valor: '236'
              vigencia_inicio: '1992-12-09'
              vigencia_fim: '2000-01-09'
          vigencia_inicio: '1992-12-09'
          vigencia_fim: '2000-01-09'
          fontes:
            - https://ditel.casacivil.ro.gov.br/cotel/Livros/Files/LC68%20-%20COMPILADA.pdf
          ---

          Art. 236. O cálculo dos proventos terá por base o vencimento do cargo acrescido de gratificação adicional por tempo de serviço e outras vantagens pecuniárias.
          """.replace("          ", ""),
              encoding="utf-8",
          )

          integral_form = """---
          type: FormaCalculo
          id: forma-calculo-totalidade-remuneracao-cargo-efetivo-cf88-original
          nome: Vencimento do cargo acrescido de adicional por tempo e vantagens — CF/88 original
          base:
            tipo: vencimento_cargo_acrescido_vantagens_pecuniarias
            dispositivos:
              - /dispositivos/lce-39-1990/art-156/original.md
              - /dispositivos/lce-68-1992/art-236/original.md
          ajustes: []
          limitadores: []
          projecao_sisprev:
            tipo_calculo: Valor Efetivo
            fidelidade: parcial
            justificativa: >-
              O rótulo `Valor Efetivo` não identifica a composição estatutária da
              base, a redação constitucional aplicável nem o ramo sem
              proporcionalização. Falta ainda transcrever o dispositivo equivalente
              da LC 1/1984 para completar a cobertura temporal.
          autorado_por: franklinbaldo
          autorado_em: 2026-08-03
          ---

          # Como calcular

          O art. 40, inciso I, da Constituição Federal em seu texto original define
          a invalidez permanente e reserva o ramo sem proporcionalização às causas
          qualificadas. Ele não define a composição da base.

          Nos períodos disciplinados pela LC 39/1990 e pela LC 68/1992, a base é o
          vencimento do cargo acrescido da gratificação adicional por tempo de
          serviço e de outras vantagens pecuniárias, conforme os arts. 156 e 236,
          respectivamente. O dispositivo equivalente da LC 1/1984 ainda deve ser
          transcrito para completar a cobertura documental do primeiro trecho da
          janela, sem reabrir a composição material já identificada.

          A paridade fica fora desta forma. Ela decorre do art. 40, § 4º, do texto
          constitucional original e constitui regime de revisão posterior.

          # Fórmula

          ```text
          provento_inicial = vencimento_cargo
                            + gratificacao_adicional_tempo_servico
                            + outras_vantagens_pecuniarias
          ```

          Não incide redução proporcional ao tempo neste ramo.

          # Entradas e saídas

          Entradas: vencimento do cargo, gratificação adicional por tempo de serviço
          e demais vantagens pecuniárias incluídas pelo estatuto vigente na data do
          direito.

          Saída: provento inicial mensal sem redução proporcional ao tempo.

          # Implementação

          A projeção atual usa `tipo_calculo: Valor Efetivo` com `integral: S`. A
          fidelidade permanece parcial porque o enum não explicita a composição da
          base nem a redação normativa aplicável.

          # Onde esta forma é usada

          No Ciclo 1, nas três unidades qualificadas de invalidez sob a CF/88
          original: acidente em serviço, moléstia profissional e doença grave
          catalogada.
          """.replace("          ", "")
          Path(
              "okf/formas-calculo/forma-calculo-totalidade-remuneracao-cargo-efetivo-cf88-original.md"
          ).write_text(integral_form, encoding="utf-8")

          proportional_form = """---
          type: FormaCalculo
          id: forma-calculo-remuneracao-cargo-proporcional-cf88-original
          nome: Vencimento do cargo e vantagens, proporcional ao tempo — CF/88 original
          base:
            tipo: vencimento_cargo_acrescido_vantagens_pecuniarias
            dispositivos:
              - /dispositivos/lce-39-1990/art-156/original.md
              - /dispositivos/lce-68-1992/art-236/original.md
          ajustes:
            - tipo: proporcional_tempo_contribuicao
              ordem: 1
              dispositivos:
                - /dispositivos/cf88/art-40-inc-i/original.md
          limitadores: []
          projecao_sisprev:
            tipo_calculo: Valor Efetivo
            fidelidade: pendente
            justificativa: >-
              `Valor Efetivo` não representa o ajuste proporcional. A composição
              estatutária da base está identificada, mas a medida da fração e a
              conversão operacional do tempo ainda precisam ser decompostas por
              trecho; falta também transcrever o dispositivo equivalente da LC
              1/1984 para completar a cobertura temporal da base.
          autorado_por: franklinbaldo
          autorado_em: 2026-08-03
          ---

          # Como calcular

          O art. 40, inciso I, da Constituição Federal em seu texto original define
          o ramo proporcional residual, mas não define a composição da base.

          Nos períodos disciplinados pela LC 39/1990 e pela LC 68/1992, a base é o
          vencimento do cargo acrescido da gratificação adicional por tempo de
          serviço e de outras vantagens pecuniárias, conforme os arts. 156 e 236,
          respectivamente. Sobre essa base incide a fração proporcional ao tempo.

          A composição material da base está identificada. Permanecem pendentes a
          medida da fração e a convenção operacional de tempo em cada trecho, além da
          transcrição do dispositivo equivalente da LC 1/1984.

          A paridade não integra esta fórmula; decorre do art. 40, § 4º, do texto
          constitucional original e opera como regime de revisão posterior.

          # Fórmula

          ```text
          base_estatutaria = vencimento_cargo
                           + gratificacao_adicional_tempo_servico
                           + outras_vantagens_pecuniarias

          provento_inicial = base_estatutaria × fracao_proporcional_tempo
          ```

          # Entradas e saídas

          Entradas já identificadas: vencimento do cargo, gratificação adicional por
          tempo de serviço, outras vantagens pecuniárias e tempo apurado no caso.

          Saída: provento inicial proporcional. O valor numérico depende do fechamento
          da medida da fração e da conversão operacional do tempo.

          # Implementação

          A projeção atual combina `tipo_calculo: Valor Efetivo` com `integral: N`.
          Essa combinação distingue o ramo no legado, mas não representa a fórmula
          completa.

          # Onde esta forma é usada

          No Ciclo 1, na unidade `invalidez-cf88-original-causa-comum`.
          """.replace("          ", "")
          Path(
              "okf/formas-calculo/forma-calculo-remuneracao-cargo-proporcional-cf88-original.md"
          ).write_text(proportional_form, encoding="utf-8")

          # 4. Regras-piloto: passado afirmativo e fundamento estadual da base.
          rule_ids = (
              "invalidez-cf88-original-acidente-em-servico",
              "invalidez-cf88-original-molestia-profissional",
              "invalidez-cf88-original-doenca-catalogada",
              "invalidez-cf88-original-causa-comum",
          )
          state_taxonomies = (
              (
                  "/dispositivos/lce-39-1990/art-156/original.md",
                  "fixa a base no vencimento do cargo acrescido do adicional por tempo de serviço e de outras vantagens pecuniárias no período da LC 39/1990",
              ),
              (
                  "/dispositivos/lce-68-1992/art-236/original.md",
                  "mantém a mesma composição da base no período da LC 68/1992",
              ),
          )

          for rule_id in rule_ids:
              path = Path("okf/regras-propostas/regras") / f"{rule_id}.md"
              data, body = split_doc(path)
              taxonomias = data.setdefault("taxonomias", [])
              refs = {str(item.get("ref")) for item in taxonomias}
              for ref, papel in state_taxonomies:
                  if ref not in refs:
                      taxonomias.append({"ref": ref, "papel": papel})

              sources = data.setdefault("proveniencia", {}).setdefault(
                  "fontes_consultadas", []
              )
              for ref, _ in state_taxonomies:
                  if ref not in sources:
                      sources.append(ref)

              projection = data["projecao"]
              field = (
                  "fundamentacao_integral"
                  if projection.get("integral") == "S"
                  else "fundamentacao_proporcional"
              )
              text = str(projection[field])
              text = text.replace(
                  "que se encontra em estado de invalidez permanente",
                  "que se encontrava em estado de invalidez permanente",
              )
              integral_sentence = (
                  "A composição concreta da base remuneratória observa a legislação "
                  "vigente na data de implementação do direito e permanece detalhada "
                  "na forma de cálculo vinculada."
              )
              integral_replacement = (
                  "A base inicial corresponde ao vencimento do cargo, acrescido da "
                  "gratificação adicional por tempo de serviço e de outras vantagens "
                  "pecuniárias, conforme o estatuto estadual vigente na data de "
                  "implementação do direito. Nos períodos já transcritos no bundle, "
                  "essa composição resulta do art. 156 da Lei Complementar nº 39/1990 "
                  "e do art. 236 da Lei Complementar nº 68/1992."
              )
              text = text.replace(integral_sentence, integral_replacement)
              proportional_sentence = (
                  "A forma de cálculo vinculada identifica a base e o ajuste "
                  "proporcional; a composição concreta da base, o denominador e a "
                  "conversão operacional do tempo serão apurados segundo a legislação "
                  "estadual vigente na data do direito, sem que esta fundamentação "
                  "antecipe parâmetro ainda não identificado."
              )
              proportional_replacement = (
                  "A forma de cálculo vinculada identifica como base o vencimento do "
                  "cargo, acrescido da gratificação adicional por tempo de serviço e "
                  "de outras vantagens pecuniárias. Permanecem pendentes a medida da "
                  "fração e a conversão operacional do tempo em cada trecho, sem que "
                  "esta fundamentação antecipe parâmetro ainda não identificado."
              )
              text = text.replace(proportional_sentence, proportional_replacement)
              projection[field] = FoldedScalarString(text)

              body = body.replace(
                  "- detalhar a composição estadual da base remuneratória em cada trecho temporal;",
                  "- transcrever o dispositivo equivalente da LC 1/1984 para completar a cobertura temporal da base;",
              )
              body = body.replace(
                  "- fechar a composição da base e a medida da fração em cada trecho da janela,\n"
                  "  mediante cotejo da LC 1/1984, LC 39/1990 e LC 68/1992;",
                  "- transcrever o dispositivo equivalente da LC 1/1984 para completar a cobertura temporal da base;\n"
                  "- fechar a medida da fração e a conversão operacional do tempo em cada trecho da janela;",
              )
              write_doc(path, data, body)
          PY

      - name: Format, regenerate and validate
        run: |
          uv run python scripts/md_format.py okf docs README.md CLAUDE.md
          uv run python scripts/gerar_indices.py
          uv run python scripts/validar_regras.py
          uv run pytest

      - name: Commit result and remove one-shot workflow
        run: |
          git rm .github/workflows/fix-pr102-state-base.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: fundamenta a base estadual das regras CF/88 original"
          git push origin HEAD:feat/fundamentacao-tres-partes
