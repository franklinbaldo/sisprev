[project]
name = "sisprev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "okf-parser>=0.1.0",
    "pikepdf>=10.11.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.15.0",
    "ruff>=0.15.22",
    "weasyprint>=69.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"
# Os notebooks são evidência reproduzível de OCR, não código de produção
# sujeito ao estilo estrito do repositório.
extend-exclude = ["fontes-oficiais/evidencias-ocr/**/*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
# Este repositório não usa `# noqa` em lugar nenhum: uma regra que não serve
# ao projeto é desligada aqui, com o motivo escrito, onde todo mundo a vê.
ignore = [
    "COM812", # conflita com o formatador
    "ISC001", # conflita com o formatador
    # S404/S603/S607: o único subprocess do repositório é `git`, com argv fixo,
    # sem shell e sem nenhum valor vindo de fora — é como se lê o SHA do commit
    # que está sendo publicado. Não há entrada não confiável a sanitizar.
    "S404",
    "S603",
    "S607",
    # INP001: `scripts/` é um diretório de comandos, não um pacote importável.
    # Nada aqui é importado por outra coisa; cada arquivo é um executável.
    "INP001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

