[project]
name = "sisprev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "okf-parser>=0.1.0",
    "pikepdf>=10.11.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.14.2",
    "ruff>=0.15.22",
    "weasyprint>=69.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"
# Os notebooks são evidência reproduzível de OCR, não código de produção
# sujeito ao estilo estrito do repositório.
extend-exclude = ["fontes-oficiais/evidencias-ocr/**/*.ipynb"]

[tool.ruff.lint]
extend-select = ["TRY", "BLE"]

[tool.ruff.lint.pydocstyle]
convention = "google"

