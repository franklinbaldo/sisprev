name: Site

# Separado do ci.yml de propósito: a toolchain Node nunca toca as guardas
# Python.
#
# O `push` para main **não** tem filtro de caminho, deliberadamente: a página
# imprime o SHA do commit publicado, então todo push tem de republicar — um
# filtro aqui deixaria o SHA no ar atrasar em silêncio. O `pull_request` tem
# filtro, mas ele precisa listar **toda** fonte que o site publica, senão uma
# PR que muda conteúdo publicado entra sem nunca ter sido buildada
# (`docs/analysis/` e `docs/rfc/` são content collections).
on:
  pull_request:
    paths:
      - "site/**"
      - "okf/**"
      - "docs/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/site.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    # Mirrors ci.yml's own lint/typecheck/test split: a separate job/status
    # per concern, not one job silently doing everything. `astro check` IS
    # this project's "tsc --noEmit" — it type-checks every .ts file too
    # (verified: an intentional type error in a plain .ts file was caught),
    # plus .astro templates and the generated content-collection types that
    # a bare `tsc` can't parse on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.7.19"
          enable-cache: true
      - run: uv sync --dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Emit site data (dados-do-site.json) — RFC 0003 §4
        # Needed even just to type-check: content.config.ts's collections
        # (and lib/site-data.ts's JSON import) only resolve once this exists.
        run: ./site/scripts/emit-data.sh
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Type-check (astro check)
        working-directory: site
        run: npm run check

  test:
    # The simulador's (RFC 0002) conservative exclusion filter — site/src/lib/
    # simulador.ts, parse-sisprev.ts — is plain TS with no Astro/content
    # dependency, so this job doesn't need the emitter or a content sync,
    # unlike typecheck above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Run unit tests (vitest)
        working-directory: site
        run: npm run test

  build:
    # Roda em push para main **e** em PR — revertendo, por premissa nova, a
    # decisão de 2026-07-30 (que já revertia a de 2026-07-29).
    #
    # **O que mudou.** Aquela decisão pesou o custo contra o que a execução em
    # PR entregava: um `dist/` construído e descartado, cuja única informação
    # era "buildou". Desde que o relatório de ciclo passou a ser o produto
    # revisável — documento paginado que circula assinado —, a execução em PR
    # entrega outra coisa: o **PDF**, anexado à execução, que quem revisa abre
    # e confere antes de aprovar. Numa revisão da PR #132 isso apareceu como
    # limite explícito ("não consegui fazer inspeção visual independente do
    # PDF de 123 folhas porque os workflows não publicaram o arquivo como
    # artifact"), e defeito de paginação não se acha lendo diff. O custo
    # continua sendo o mesmo; o que ele compra deixou de ser nada.
    #
    # O gatilho `pull_request` tem filtro de caminho (topo do arquivo), então
    # PR que não toca fonte publicada segue sem pagar por isto.
    #
    # A ordem de execução continua sendo a garantia principal, e não muda: o
    # `push` para main não tem filtro de caminho, todo merge roda este job
    # integralmente antes de publicar, e o `deploy` depende dele.
    #
    # Este é o job mais caro do repositório: toolchain Node, Astro, Pagefind,
    # Pango do sistema e a paginação do PDF pelo WeasyPrint. Em PR o artefato
    # do Pages era construído e descartado, e o custo era pago em cada push de
    # cada PR que tocasse `okf/**` ou `docs/**` — isto é, em praticamente toda
    # PR de auditoria, que é o trabalho corrente do repositório.
    #
    # **O que se perde, e é preciso dizer, porque esta decisão já foi tomada
    # nos dois sentidos.** A prova de que a paginação ainda funciona e de que o
    # emissor ainda emite passa a aparecer **depois** do merge, com o job
    # vermelho em main em vez de na PR. O modo de falha que ela cobre é caro de
    # um jeito específico: um `url_fetcher` que não resolve gera PDF **legível
    # e sem nenhuma quebra de página**, defeito que não se anuncia — e o
    # `npm run build` manual antes de integrar não é gate, é lembrete, que
    # depende de quem abre a PR lembrar e ter o Pango instalado.
    #
    # A mitigação é a ordem de execução, não a disciplina: o gatilho `push` não
    # tem filtro de **caminho** (só de branch), então todo merge roda este job
    # integralmente antes de publicar, e o `deploy` depende dele. Um build
    # quebrado derruba o merge commit em main e **não** chega ao Pages — o site
    # publicado nunca serve um estado que este job reprovou. O que muda é onde o
    # sinal aparece, não se ele aparece.
    #
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.7.19"
          enable-cache: true
      - run: uv sync --dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Generate downloadable Repomix bundles
        # These are deliberately scoped exports. They are generated in
        # `site/public/` so GitHub Pages publishes them beside the report PDF,
        # while the source repository does not gain generated bulk files.
        run: |
          mkdir -p site/public/downloads
          npx --yes repomix@1.17.0 --style markdown --output site/public/downloads/repomix-regras.md --include "okf/regras-sisprev/regras/**/*.md"
          npx --yes repomix@1.17.0 --style markdown --output site/public/downloads/repomix-leis.md --include "okf/dispositivos/**/*.md"
          npx --yes repomix@1.17.0 --style markdown --output site/public/downloads/repomix-okf.md --include "okf/**/*.md"
          npx --yes repomix@1.17.0 --style markdown --output site/public/downloads/repomix-analises.md --include "docs/analysis/**/*.md,docs/rfc/**/*.md"
      - name: Emit site data (dados-do-site.json) — RFC 0003 §4
        run: ./site/scripts/emit-data.sh
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build site (astro build)
        working-directory: site
        run: npm run build
      - name: Install WeasyPrint's system libraries
        # WeasyPrint renderiza texto pelo Pango, que é biblioteca do sistema e
        # não vem pelo `uv sync`. Instalada explicitamente em vez de contar com
        # o que a imagem do runner traz hoje: o modo de falha é o PDF sair sem
        # tipografia certa (ou não sair), num artefato que ninguém reabre antes
        # de juntar ao processo.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - name: Generate the PGE validation report PDF into dist/
        # Depois do `npm run build` (e do Pagefind, que roda no postbuild) e
        # antes do upload: o PDF é escrito em `site/dist/`, então ele sobe no
        # mesmo artefato do Pages e fica publicado ao lado da página que o
        # oferece. Um erro aqui (folha de estilo que não resolve, por
        # exemplo) é falha explícita, não PDF torto em silêncio — e, com o job
        # rodando em PR, essa falha volta a aparecer antes do merge.
        run: uv run python scripts/gerar_relatorio_pdf.py

      # E o motivo de o job voltar a rodar em PR: os PDFs anexados à execução,
      # para quem revisa abrir e conferir antes de aprovar. Defeito de
      # paginação — folha em branco, coluna estourando a margem, numeração
      # voltando a romano no meio — não se acha lendo diff, e este repositório
      # já corrigiu os três.
      #
      # Só os PDFs, não o `dist/` inteiro: o que se revisa é o documento, e
      # subir o site buildado junto faria o revisor procurar o arquivo dentro
      # de dezenas de megabytes. Retenção curta porque o artefato é insumo de
      # uma revisão em curso, não registro — o registro é o que o `deploy`
      # publica a partir de main.
      - name: Upload the report PDFs for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorios-pdf
          path: site/dist/*.pdf
          retention-days: 14
          if-no-files-found: error

      # Os dois passos abaixo são o que de fato publica, e só eles são
      # condicionais a main: em PR o `dist/` é construído, o PDF é paginado e
      # anexado à execução, e nada vai ao Pages. É essa assimetria que faz
      # "verificar" e "publicar" serem coisas separadas dentro de um job só,
      # em vez de dois jobs repetindo o build.
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Smoke check — deployed page responds and matches this commit's SHA
        # RFC 0003 §7: a deploy that silently fails must not leave a stale
        # site serving an old commit's content unnoticed — this is the check
        # that makes that failure visible instead. Retries: Pages' CDN can
        # briefly keep serving the previous deploy right after this action
        # reports success, so a single immediate curl can false-negative.
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          sha="${{ github.sha }}"
          max_attempts=10
          delay_seconds=6
          for attempt in $(seq 1 "$max_attempts"); do
            if body="$(curl -fsSL "$url")" && grep -q "$sha" <<< "$body"; then
              echo "OK: $url serves commit $sha (attempt $attempt/$max_attempts)."
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: $url does not yet show commit $sha. Retrying in ${delay_seconds}s..."
            sleep "$delay_seconds"
          done
          echo "Deployed page at $url still does not show the expected commit SHA $sha after $max_attempts attempts."
          exit 1
