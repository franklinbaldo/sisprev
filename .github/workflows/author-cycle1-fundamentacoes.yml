name: Author Cycle 1 fundamentacoes

on:
  push:
    branches:
      - feat/fundamentacao-tres-partes

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/fundamentacao-tres-partes
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply the reviewed Cycle 1 authorship rule
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          from io import StringIO
          from pathlib import Path
          import re

          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import FoldedScalarString

          TARGETS = [
              "invalidez-ec20-acidente-em-servico",
              "invalidez-ec20-molestia-profissional",
              "invalidez-ec20-doenca-catalogada",
              "invalidez-ec20-causa-comum",
              "invalidez-ec41-geral-pre-mp167-acidente-em-servico",
              "invalidez-ec41-geral-pre-mp167-molestia-profissional",
              "invalidez-ec41-geral-pre-mp167-doenca-catalogada",
              "invalidez-ec41-geral-pre-mp167-causa-comum",
              "invalidez-ec41-geral-acidente-em-servico",
              "invalidez-ec41-geral-molestia-profissional",
              "invalidez-ec41-geral-doenca-catalogada",
              "invalidez-ec41-geral-media-lc228-causa-comum",
              "invalidez-ec41-geral-causa-comum",
              "invalidez-ec70-art-6a-acidente-em-servico",
              "invalidez-ec70-art-6a-molestia-profissional",
              "invalidez-ec70-art-6a-doenca-catalogada",
              "invalidez-ec70-art-6a-lc228-causa-comum",
              "invalidez-ec70-art-6a-causa-comum",
              "incapacidade-lce1100-ate-2003-acidente-em-servico",
              "incapacidade-lce1100-ate-2003-molestia-profissional",
              "incapacidade-lce1100-ate-2003-doenca-catalogada",
              "incapacidade-lce1100-ate-2003-causa-comum",
              "incapacidade-lce1100-apos-2003-acidente-em-servico",
              "incapacidade-lce1100-apos-2003-molestia-profissional",
              "incapacidade-lce1100-apos-2003-doenca-catalogada",
              "incapacidade-lce1100-apos-2003-causa-comum",
          ]

          NORMA = {
              "cf88": "Constituição Federal",
              "ec-20-1998": "Emenda Constitucional nº 20/1998",
              "ec-41-2003": "Emenda Constitucional nº 41/2003",
              "ec-70-2012": "Emenda Constitucional nº 70/2012",
              "ece-146-2021": "Emenda à Constituição do Estado nº 146/2021",
              "mp-167-2004": "Medida Provisória nº 167/2004",
              "lei-10887-2004": "Lei nº 10.887/2004",
              "lce-228-2000": "Lei Complementar Estadual nº 228/2000",
              "lce-432-2008": "Lei Complementar Estadual nº 432/2008",
              "lce-1100-2021": "Lei Complementar Estadual nº 1.100/2021",
          }

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 88

          def split_doc(path: Path):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise ValueError(path)
              _, frontmatter, body = text.split("---", 2)
              return yaml.load(frontmatter), body

          def write_doc(path: Path, data, body: str):
              out = StringIO()
              yaml.dump(data, out)
              path.write_text(f"---\n{out.getvalue()}---{body}", encoding="utf-8")

          def date_only(value) -> str:
              return str(value).split()[0]

          def ordinal(value: str) -> str:
              if value.isdigit():
                  return f"{value}º"
              return value

          def citation(ref: str) -> str:
              path = Path("okf") / ref.lstrip("/")
              data, _ = split_doc(path)
              components = data.get("componentes", [])
              rendered = []
              for component in components:
                  kind = str(component.get("tipo", "")).lower()
                  value = str(component.get("valor", ""))
                  if kind == "artigo":
                      rendered.append(f"art. {value}")
                  elif kind in {"paragrafo", "parágrafo"}:
                      rendered.append("parágrafo único" if value.lower() in {"unico", "único"} else f"§ {ordinal(value)}")
                  elif kind == "inciso":
                      rendered.append(f"inciso {value}")
                  elif kind in {"alinea", "alínea"}:
                      rendered.append(f"alínea “{value}”")
                  elif kind == "caput":
                      rendered.append("caput")
              if not rendered:
                  match = re.search(r"art-(\d+)", ref)
                  rendered.append(f"art. {match.group(1)}" if match else "dispositivo")
              base = rendered[0]
              if len(rendered) > 1:
                  base += ", " + ", ".join(rendered[1:])
              norma_id = str(data.get("norma", ""))
              base += f", da {NORMA.get(norma_id, norma_id)}"
              stem = path.stem
              if norma_id == "cf88" and stem.startswith("ec-"):
                  parts = stem.split("-")
                  base += f", na redação da EC {parts[1]}/{parts[2]}"
              elif norma_id == "cf88" and stem == "original":
                  base += ", em sua redação original"
              return base

          def temporal(data) -> str:
              dates = data.get("aplicabilidade_temporal", {}).get("datas_legadas", {})
              after = dates.get("data_direito_apos")
              until = dates.get("data_direito_ate")
              pieces = []
              if after and until:
                  pieces.append(
                      "a data de implementação de todos os requisitos se situava a partir de "
                      f"{date_only(after)}, inclusive, e antes de {date_only(until)}"
                  )
              elif after:
                  pieces.append(
                      "a data de implementação de todos os requisitos era "
                      f"{date_only(after)} ou posterior"
                  )
              adm_until = dates.get("data_adm_ate")
              adm_after = dates.get("data_adm_apos")
              if adm_until:
                  pieces.append(
                      f"o ingresso no serviço público ocorreu até {date_only(adm_until)}, inclusive"
                  )
              if adm_after:
                  pieces.append(
                      f"o ingresso no serviço público ocorreu em {date_only(adm_after)} ou depois"
                  )
              if not pieces:
                  return ""
              return " Ficou também demonstrado que " + " e que ".join(pieces) + "."

          for rule_id in TARGETS:
              path = Path("okf/regras-propostas/regras") / f"{rule_id}.md"
              data, body = split_doc(path)
              requirement = data["requisitos_verificacao_humana"][0]
              protocol = requirement["protocolo_verificacao"]

              part1 = (
                  "No curso do processo administrativo, ficou demonstrado que o interessado era "
                  "servidor titular de cargo efetivo e que "
                  f"{str(requirement['predicado']).rstrip('.')}; a verificação foi realizada por "
                  f"{str(protocol['responsavel']).rstrip('.')}, mediante "
                  f"{str(protocol['meio_de_prova']).rstrip('.')}, tendo sido exigida a seguinte "
                  f"evidência: {str(protocol['evidencia_exigida']).rstrip('.')}."
                  + temporal(data)
              )

              legal = []
              for item in data.get("taxonomias", []):
                  role = str(item["papel"]).strip().rstrip(".")
                  legal.append(f"{citation(str(item['ref']))} {role}.")
              part2 = (
                  "A hipótese e seus efeitos resultam da conjugação dos dispositivos aplicáveis. "
                  + " ".join(legal)
              )

              sources = data.get("proveniencia", {}).get("fontes_consultadas", [])
              form_refs = [
                  str(source)
                  for source in sources
                  if isinstance(source, str) and source.startswith("/formas-calculo/")
              ]
              if len(form_refs) != 1:
                  raise ValueError(f"{rule_id}: expected one FormaCalculo, got {form_refs}")
              form_data, _ = split_doc(Path("okf") / form_refs[0].lstrip("/"))
              form_name = str(form_data["nome"])
              projection = data["projecao"]
              integral = projection.get("integral") == "S"
              parity = projection.get("paridade") == "S"
              calc_effect = (
                  "O resultado não sofre redução proporcional ao tempo."
                  if integral
                  else "O resultado recebe a proporcionalização pelo tempo descrita nessa forma."
              )
              parity_effect = (
                  "Após a concessão, os proventos são revistos com paridade, segundo o dispositivo específico articulado acima."
                  if parity
                  else "Após a concessão, o reajuste ocorre sem paridade, de acordo com o regime articulado acima."
              )
              part3 = (
                  f"O cálculo inicial segue a forma “{form_name}”, vinculada a esta regra e "
                  f"sustentada pelos dispositivos articulados acima. {calc_effect} {parity_effect} "
                  "Eventual parâmetro ainda indicado como pendente na forma de cálculo ou no corpo "
                  "da regra não é antecipado por esta fundamentação."
              )

              field = "fundamentacao_integral" if integral else "fundamentacao_proporcional"
              opposite = "fundamentacao_proporcional" if integral else "fundamentacao_integral"
              projection.pop(opposite, None)
              projection[field] = FoldedScalarString(f"{part1}\n\n{part2}\n\n{part3}")
              write_doc(path, data, body)
          PY

      - name: Format and regenerate derived artifacts
        run: |
          uv run python scripts/md_format.py okf docs README.md CLAUDE.md
          uv run python scripts/gerar_indices.py
          uv run python scripts/validar_regras.py

      - name: Commit results and remove temporary workflow
        run: |
          git rm .github/workflows/author-cycle1-fundamentacoes.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: aplica a RFC 0014 às 30 regras do Ciclo 1"
          git push origin HEAD:feat/fundamentacao-tres-partes
