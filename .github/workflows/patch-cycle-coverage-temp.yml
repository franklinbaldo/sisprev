name: Temporary patch cycle coverage criterion

on:
  push:
    branches:
      - cycle/1-operacionalizacao

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cycle/1-operacionalizacao
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
          enable-cache: true
      - run: uv sync --dev
      - name: Patch cycle completion criterion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("okf/regras-sisprev/ciclos/ciclo-01.md")
          text = path.read_text(encoding="utf-8")

          old = (
              "O produto não é uma nova análise paralela. O produto é o próprio catálogo\n"
              "corrigido, os achados autorais necessários e o resultado consolidado neste\n"
              "arquivo.\n"
          )
          new = old + (
              "\nO ciclo não termina apenas com a classificação das linhas importadas. O estado\n"
              "final esperado é um conjunto ativo de regras juridicamente correto e\n"
              "completo: toda regra materialmente errada deve ser desativada, toda hipótese\n"
              "que ela representava deve possuir substituição correta e todas as combinações\n"
              "juridicamente relevantes do tema devem estar cobertas, sem lacuna nem\n"
              "sobreposição injustificada.\n"
          )
          text = text.replace(old, new)

          anchor = (
              "12. **`DATA_ADM_APOS` é inclusivo.** O campo representa a fronteira inferior do\n"
              "    ingresso no serviço público; para cargo efetivo, o marco jurídico é a posse.\n"
          )
          replacement = anchor + (
              "13. **O objeto final é o conjunto de regras ativas.** A auditoria não preserva\n"
              "    uma regra errada apenas para manter continuidade de ID. Regras erradas são\n"
              "    desativadas, hipóteses corretas recebem regras próprias e a cobertura do tema\n"
              "    é demonstrada por uma matriz exaustiva de combinações juridicamente\n"
              "    relevantes.\n"
          )
          text = text.replace(anchor, replacement)

          old_t4 = '''### T4 — Resultado admissível por regra

Cada regra deve terminar o ciclo em exatamente uma destas situações:

- **conferida sem alteração**;
- **corrigida**;
- **inativada com conclusão, justificativa e substituição identificável**; ou
- **pendente por dependência externa**, com a pergunta, a evidência faltante, o
  responsável pela obtenção e o efeito preciso sobre a regra.

“Não analisada” ou “parece correta” não são resultados de encerramento.
'''
          new_t4 = '''### T4 — Resultado admissível por regra e cobertura final

Durante a execução, cada regra deve receber exatamente uma destas situações:

- **conferida sem alteração**;
- **corrigida e mantida ativa**;
- **desativada e substituída**, com todas as regras substitutas identificadas; ou
- **pendente por dependência externa**, com a pergunta, a evidência faltante, o
  responsável pela obtenção e o efeito preciso sobre a regra.

A situação pendente é admissível como estado intermediário de uma sessão, mas
não encerra o ciclo quando impedir afirmar a cobertura material do tema. No
fechamento, deve ser possível demonstrar simultaneamente que:

1. nenhuma regra sabidamente errada permanece ativa;
2. toda regra desativada possui substituição suficiente para as hipóteses que
   representava corretamente;
3. toda combinação juridicamente relevante de regime, janela, causa, ramo,
   cálculo e reajuste está coberta por ao menos uma regra ativa; e
4. sobreposições entre regras ativas são inexistentes ou juridicamente
   intencionais e expressamente justificadas.

“Não analisada”, “parece correta” ou “desativada sem substituição” não são
resultados de encerramento.
'''
          text = text.replace(old_t4, new_t4)

          text = text.replace(
              "| S6 — fechamento | `cycle/1-s6-fechamento` | Regenerar derivados, executar gates, preencher conclusão e encerrar o ciclo. | PR final com resumo por regra, fontes, riscos residuais e CI verde. | Checklist de conclusão integralmente tratado e issue #89 pronta para encerramento. |",
              "| S6 — fechamento | `cycle/1-s6-fechamento` | Regenerar derivados, executar gates, preencher conclusão e encerrar o ciclo. | PR final com resumo por regra, mapa de substituições, matriz de cobertura, fontes, riscos residuais e CI verde. | Nenhuma regra errada permanece ativa; toda desativação tem substituição; a matriz demonstra cobertura completa sem lacunas ou sobreposições injustificadas; checklist integralmente tratado. |",
          )

          text = text.replace(
              "5. artefatos derivados sincronizados; e\n6. CI integralmente verde.\n",
              "5. mapa explícito `regra desativada → regra(s) substituta(s)`;\n6. matriz final de cobertura das combinações juridicamente relevantes;\n7. artefatos derivados sincronizados; e\n8. CI integralmente verde.\n",
          )

          text = text.replace(
              "Preencher cada linha com uma das situações de T4 e resumir: decisão, alterações,\nfontes, achados e dependências.\n",
              "Preencher cada linha com uma das situações de T4 e resumir: decisão, alterações,\nfontes, achados, dependências e, quando desativada, a regra ou o conjunto de\nregras que a substitui.\n",
          )

          conclusion_anchor = "- [ ] Todas as regras proprietárias receberam uma situação final de T4.\n"
          conclusion_new = conclusion_anchor + (
              "- [ ] Nenhuma regra sabidamente errada permanece ativa.\n"
              "- [ ] Toda regra desativada possui substituição identificada e suficiente.\n"
              "- [ ] A matriz final demonstra cobertura completa das combinações juridicamente\n"
              "  relevantes do tema.\n"
              "- [ ] Toda sobreposição entre regras ativas foi eliminada ou expressamente\n"
              "  justificada.\n"
          )
          text = text.replace(conclusion_anchor, conclusion_new)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format markdown
        run: uv run python scripts/md_format.py okf/regras-sisprev/ciclos/ciclo-01.md
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Coverage criterion already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add okf/regras-sisprev/ciclos/ciclo-01.md
          git commit -m "docs: require complete rule coverage at cycle close"
          git push origin HEAD:cycle/1-operacionalizacao
