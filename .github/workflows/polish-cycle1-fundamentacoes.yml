name: Polish Cycle 1 fundamentacoes

on:
  push:
    branches:
      - feat/fundamentacao-tres-partes

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/fundamentacao-tres-partes
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19

      - name: Install dependencies
        run: uv sync --dev

      - name: Polish authored texts
        id: polish
        continue-on-error: true
        run: |
          uv run python - <<'PY' > /tmp/polish-cycle1.log 2>&1
          from io import StringIO
          from pathlib import Path
          import re

          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import FoldedScalarString

          TARGETS = [
              "invalidez-ec20-acidente-em-servico",
              "invalidez-ec20-molestia-profissional",
              "invalidez-ec20-doenca-catalogada",
              "invalidez-ec20-causa-comum",
              "invalidez-ec41-geral-pre-mp167-acidente-em-servico",
              "invalidez-ec41-geral-pre-mp167-molestia-profissional",
              "invalidez-ec41-geral-pre-mp167-doenca-catalogada",
              "invalidez-ec41-geral-pre-mp167-causa-comum",
              "invalidez-ec41-geral-acidente-em-servico",
              "invalidez-ec41-geral-molestia-profissional",
              "invalidez-ec41-geral-doenca-catalogada",
              "invalidez-ec41-geral-media-lc228-causa-comum",
              "invalidez-ec41-geral-causa-comum",
              "invalidez-ec70-art-6a-acidente-em-servico",
              "invalidez-ec70-art-6a-molestia-profissional",
              "invalidez-ec70-art-6a-doenca-catalogada",
              "invalidez-ec70-art-6a-lc228-causa-comum",
              "invalidez-ec70-art-6a-causa-comum",
              "incapacidade-lce1100-ate-2003-acidente-em-servico",
              "incapacidade-lce1100-ate-2003-molestia-profissional",
              "incapacidade-lce1100-ate-2003-doenca-catalogada",
              "incapacidade-lce1100-ate-2003-causa-comum",
              "incapacidade-lce1100-apos-2003-acidente-em-servico",
              "incapacidade-lce1100-apos-2003-molestia-profissional",
              "incapacidade-lce1100-apos-2003-doenca-catalogada",
              "incapacidade-lce1100-apos-2003-causa-comum",
          ]

          NORMS = {
              "cf88": "Constituição Federal",
              "ec-20-1998": "Emenda Constitucional nº 20/1998",
              "ec-41-2003": "Emenda Constitucional nº 41/2003",
              "ec-70-2012": "Emenda Constitucional nº 70/2012",
              "ece-146-2021": "Emenda à Constituição do Estado nº 146/2021",
              "mp-167-2004": "Medida Provisória nº 167/2004",
              "lei-10887-2004": "Lei nº 10.887/2004",
              "lce-228-2000": "Lei Complementar Estadual nº 228/2000",
              "lce-432-2008": "Lei Complementar Estadual nº 432/2008",
              "lce-1100-2021": "Lei Complementar Estadual nº 1.100/2021",
          }

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 88

          def read_doc(path):
              text = Path(path).read_text(encoding="utf-8")
              _, frontmatter, body = text.split("---", 2)
              return yaml.load(frontmatter), body

          def write_doc(path, data, body):
              stream = StringIO()
              yaml.dump(data, stream)
              Path(path).write_text(f"---\n{stream.getvalue()}---{body}", encoding="utf-8")

          def date(value):
              return str(value).split()[0]

          def paragraph_number(value):
              number = int(value)
              return f"{number}º" if number <= 9 else str(number)

          def citation(ref):
              parts = ref.strip("/").split("/")
              norm_id = parts[1]
              norm = NORMS.get(norm_id, norm_id)
              component = "/".join(parts[2:-1])
              labels = []
              match = re.search(r"art-(\d+)", component)
              if match:
                  labels.append(f"art. {match.group(1)}")
              match = re.search(r"par-(unico|único|\d+)", component)
              if match:
                  value = match.group(1)
                  labels.append("parágrafo único" if not value.isdigit() else f"§ {paragraph_number(value)}")
              match = re.search(r"inc-([ivxlcdm]+|\d+)", component, re.I)
              if match:
                  labels.append(f"inciso {match.group(1).upper()}")
              match = re.search(r"(?:al|alin)-([a-z])", component)
              if match:
                  labels.append(f"alínea “{match.group(1)}”")
              if "caput" in component:
                  labels.append("caput")
              if not labels:
                  labels.append("dispositivo")
              if len(labels) == 1:
                  label = f"{labels[0]} da {norm}"
              else:
                  label = f"{', '.join(labels)}, da {norm}"
              version = parts[-1].removesuffix(".md")
              if norm_id == "cf88" and version == "original":
                  label += ", em sua redação original"
              elif norm_id == "cf88" and version.startswith("ec-"):
                  _, number, year = version.split("-", 2)
                  label += f", na redação da EC {number}/{year}"
              return label

          def past(predicate):
              text = str(predicate).strip().rstrip(".")
              text = re.sub(r"\bnão decorre\b", "não decorria", text)
              text = re.sub(r"\bdecorre\b", "decorria", text)
              text = re.sub(r"\bestá incluíd([oa])\b", r"estava incluíd\1", text)
              text = re.sub(r"\bconsta\b", "constava", text)
              return text

          def temporal(data):
              dates = data.get("aplicabilidade_temporal", {}).get("datas_legadas", {})
              facts = []
              after = dates.get("data_direito_apos")
              until = dates.get("data_direito_ate")
              if after and until:
                  facts.append(f"os requisitos foram implementados em {date(after)} ou depois, mas antes de {date(until)}")
              elif after:
                  facts.append(f"os requisitos foram implementados em {date(after)} ou depois")
              if dates.get("data_adm_ate"):
                  facts.append(f"o ingresso no serviço público ocorreu até {date(dates['data_adm_ate'])}, inclusive")
              if dates.get("data_adm_apos"):
                  facts.append(f"o ingresso no serviço público ocorreu em {date(dates['data_adm_apos'])} ou depois")
              return " Ficou também demonstrado que " + " e que ".join(facts) + "." if facts else ""

          for rule_id in TARGETS:
              path = Path("okf/regras-propostas/regras") / f"{rule_id}.md"
              data, body = read_doc(path)

              if rule_id.startswith("invalidez-ec20-"):
                  acquired_ref = "/dispositivos/ec-41-2003/art-3-caput/original.md"
                  taxonomies = data.setdefault("taxonomias", [])
                  if not any(item.get("ref") == acquired_ref for item in taxonomies):
                      taxonomies.append({
                          "ref": acquired_ref,
                          "papel": "preserva a concessão pelos critérios anteriores para o direito adquirido",
                      })
                  sources = list(data.setdefault("proveniencia", {}).setdefault("fontes_consultadas", []))
                  sources = [
                      source for source in sources
                      if not (isinstance(source, str) and source.startswith("EC 41/2003, art. 3"))
                  ]
                  if acquired_ref not in sources:
                      sources.append(acquired_ref)
                  data["proveniencia"]["fontes_consultadas"] = sources

              requirement = data["requisitos_verificacao_humana"][0]
              protocol = requirement["protocolo_verificacao"]
              part1 = (
                  "No curso do processo administrativo, ficou demonstrado que o interessado era servidor titular de cargo efetivo e que "
                  f"{past(requirement['predicado'])}; a verificação foi realizada por {str(protocol['responsavel']).rstrip('.')}, "
                  f"mediante {str(protocol['meio_de_prova']).rstrip('.')}, tendo sido exigida a seguinte evidência: "
                  f"{str(protocol['evidencia_exigida']).rstrip('.')}." + temporal(data)
              )

              devices = []
              for item in data.get("taxonomias", []):
                  devices.append(f"O {citation(str(item['ref']))} {str(item['papel']).strip().rstrip('.')}.")
              part2 = "A hipótese e seus efeitos resultam da conjugação dos dispositivos aplicáveis. " + " ".join(devices)

              form_refs = [
                  source for source in data["proveniencia"]["fontes_consultadas"]
                  if isinstance(source, str) and source.startswith("/formas-calculo/")
              ]
              if len(form_refs) != 1:
                  raise ValueError(f"{rule_id}: expected one FormaCalculo, got {form_refs}")
              form_data, _ = read_doc(Path("okf") / form_refs[0].lstrip("/"))

              projection = data["projecao"]
              integral = projection.get("integral") == "S"
              parity = projection.get("paridade") == "S"
              part3 = (
                  f"O cálculo inicial segue a forma “{form_data['nome']}”, vinculada a esta regra e sustentada pelos dispositivos articulados acima. "
                  + ("O resultado não sofre redução proporcional ao tempo. " if integral else "O resultado recebe a proporcionalização pelo tempo descrita nessa forma. ")
                  + ("Após a concessão, os proventos são revistos com paridade, segundo o dispositivo específico articulado acima. " if parity else "Após a concessão, o reajuste ocorre sem paridade, de acordo com o regime articulado acima. ")
                  + "Eventual parâmetro ainda indicado como pendente na forma de cálculo ou no corpo da regra não é antecipado por esta fundamentação."
              )

              field = "fundamentacao_integral" if integral else "fundamentacao_proporcional"
              projection[field] = FoldedScalarString(f"{part1}\n\n{part2}\n\n{part3}")
              write_doc(path, data, body)

          print(f"Polished {len(TARGETS)} Cycle 1 rules")
          PY

      - name: Format and regenerate artifacts
        if: steps.polish.outcome == 'success'
        continue-on-error: true
        run: |
          uv run python scripts/md_format.py okf docs README.md CLAUDE.md
          uv run python scripts/gerar_indices.py

      - name: Preserve diagnostic on failure
        if: steps.polish.outcome != 'success'
        run: cp /tmp/polish-cycle1.log docs/analysis/pr102-polish-cycle1-error.log

      - name: Commit and remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/polish-cycle1-fundamentacoes.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: revisa tempo verbal e articulação das fundamentações"
          git push origin HEAD:feat/fundamentacao-tres-partes
