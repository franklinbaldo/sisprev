name: Author Cycle 1 fundamentacoes

on:
  push:
    branches:
      - feat/fundamentacao-tres-partes

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/fundamentacao-tres-partes
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19

      - name: Install dependencies
        run: uv sync --dev

      - name: Author the remaining Cycle 1 fundamentacoes
        id: author
        continue-on-error: true
        run: |
          uv run python - <<'PY' > /tmp/author-cycle1.log 2>&1
          from io import StringIO
          from pathlib import Path
          import re

          from ruamel.yaml import YAML
          from ruamel.yaml.scalarstring import FoldedScalarString

          FORMS = {
              "invalidez-ec20-acidente-em-servico": "forma-calculo-totalidade-remuneracao-cargo-efetivo-ec20.md",
              "invalidez-ec20-molestia-profissional": "forma-calculo-totalidade-remuneracao-cargo-efetivo-ec20.md",
              "invalidez-ec20-doenca-catalogada": "forma-calculo-totalidade-remuneracao-cargo-efetivo-ec20.md",
              "invalidez-ec20-causa-comum": "forma-calculo-totalidade-proporcional-tempo.md",
              "invalidez-ec41-geral-pre-mp167-acidente-em-servico": "forma-calculo-remuneracao-cargo-integral-lc228.md",
              "invalidez-ec41-geral-pre-mp167-molestia-profissional": "forma-calculo-remuneracao-cargo-integral-lc228.md",
              "invalidez-ec41-geral-pre-mp167-doenca-catalogada": "forma-calculo-remuneracao-cargo-integral-lc228.md",
              "invalidez-ec41-geral-pre-mp167-causa-comum": "forma-calculo-remuneracao-cargo-proporcional-lc228.md",
              "invalidez-ec41-geral-acidente-em-servico": "forma-calculo-media-80-invalidez-ec41.md",
              "invalidez-ec41-geral-molestia-profissional": "forma-calculo-media-80-invalidez-ec41.md",
              "invalidez-ec41-geral-doenca-catalogada": "forma-calculo-media-80-invalidez-ec41.md",
              "invalidez-ec41-geral-media-lc228-causa-comum": "forma-calculo-media-proporcional-lc228-lei10887.md",
              "invalidez-ec41-geral-causa-comum": "forma-calculo-media-proporcional-dias-lce432.md",
              "invalidez-ec70-art-6a-acidente-em-servico": "forma-calculo-remuneracao-cargo-integral-lc228.md",
              "invalidez-ec70-art-6a-molestia-profissional": "forma-calculo-remuneracao-cargo-integral-lc228.md",
              "invalidez-ec70-art-6a-doenca-catalogada": "forma-calculo-remuneracao-cargo-integral-lc228.md",
              "invalidez-ec70-art-6a-lc228-causa-comum": "forma-calculo-remuneracao-cargo-ec70-proporcional-anos.md",
              "invalidez-ec70-art-6a-causa-comum": "forma-calculo-remuneracao-cargo-ec70-proporcional-dias.md",
              "incapacidade-lce1100-ate-2003-acidente-em-servico": "forma-calculo-media-80-contribuicoes-lce1100.md",
              "incapacidade-lce1100-ate-2003-molestia-profissional": "forma-calculo-media-80-contribuicoes-lce1100.md",
              "incapacidade-lce1100-ate-2003-doenca-catalogada": "forma-calculo-media-80-contribuicoes-lce1100.md",
              "incapacidade-lce1100-ate-2003-causa-comum": "forma-calculo-media-80-proporcional-dias-lce1100.md",
              "incapacidade-lce1100-apos-2003-acidente-em-servico": "forma-calculo-media-80-contribuicoes-lce1100.md",
              "incapacidade-lce1100-apos-2003-molestia-profissional": "forma-calculo-media-80-contribuicoes-lce1100.md",
              "incapacidade-lce1100-apos-2003-doenca-catalogada": "forma-calculo-media-80-contribuicoes-lce1100.md",
              "incapacidade-lce1100-apos-2003-causa-comum": "forma-calculo-media-80-proporcional-dias-lce1100.md",
          }

          NORMS = {
              "cf88": "Constituição Federal",
              "ec-20-1998": "Emenda Constitucional nº 20/1998",
              "ec-41-2003": "Emenda Constitucional nº 41/2003",
              "ec-70-2012": "Emenda Constitucional nº 70/2012",
              "ece-146-2021": "Emenda à Constituição do Estado nº 146/2021",
              "mp-167-2004": "Medida Provisória nº 167/2004",
              "lei-10887-2004": "Lei nº 10.887/2004",
              "lce-228-2000": "Lei Complementar Estadual nº 228/2000",
              "lce-432-2008": "Lei Complementar Estadual nº 432/2008",
              "lce-1100-2021": "Lei Complementar Estadual nº 1.100/2021",
          }

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 88

          def read_doc(path):
              text = Path(path).read_text(encoding="utf-8")
              _, frontmatter, body = text.split("---", 2)
              return yaml.load(frontmatter), body

          def write_doc(path, data, body):
              stream = StringIO()
              yaml.dump(data, stream)
              Path(path).write_text(f"---\n{stream.getvalue()}---{body}", encoding="utf-8")

          def date(value):
              return str(value).split()[0]

          def citation(ref):
              parts = ref.strip("/").split("/")
              norm = NORMS.get(parts[1], parts[1])
              component = "/".join(parts[2:-1])
              labels = []
              match = re.search(r"art-(\d+)", component)
              if match:
                  labels.append(f"art. {match.group(1)}")
              match = re.search(r"par-(unico|único|\d+)", component)
              if match:
                  value = match.group(1)
                  labels.append("parágrafo único" if not value.isdigit() else f"§ {value}º")
              match = re.search(r"inc-([ivxlcdm]+|\d+)", component, re.I)
              if match:
                  labels.append(f"inciso {match.group(1).upper()}")
              match = re.search(r"(?:al|alin)-([a-z])", component)
              if match:
                  labels.append(f"alínea “{match.group(1)}”")
              if "caput" in component:
                  labels.append("caput")
              label = ", ".join(labels) if labels else "dispositivo"
              label += f", da {norm}"
              version = parts[-1].removesuffix(".md")
              if parts[1] == "cf88" and version == "original":
                  label += ", em sua redação original"
              elif parts[1] == "cf88" and version.startswith("ec-"):
                  _, number, year = version.split("-", 2)
                  label += f", na redação da EC {number}/{year}"
              return label

          def temporal(data):
              dates = data.get("aplicabilidade_temporal", {}).get("datas_legadas", {})
              facts = []
              after = dates.get("data_direito_apos")
              until = dates.get("data_direito_ate")
              if after and until:
                  facts.append(f"os requisitos foram implementados em {date(after)} ou depois, mas antes de {date(until)}")
              elif after:
                  facts.append(f"os requisitos foram implementados em {date(after)} ou depois")
              if dates.get("data_adm_ate"):
                  facts.append(f"o ingresso no serviço público ocorreu até {date(dates['data_adm_ate'])}, inclusive")
              if dates.get("data_adm_apos"):
                  facts.append(f"o ingresso no serviço público ocorreu em {date(dates['data_adm_apos'])} ou depois")
              return " Ficou também demonstrado que " + " e que ".join(facts) + "." if facts else ""

          for rule_id, form_file in FORMS.items():
              rule_path = Path("okf/regras-propostas/regras") / f"{rule_id}.md"
              data, body = read_doc(rule_path)
              requirement = data["requisitos_verificacao_humana"][0]
              protocol = requirement["protocolo_verificacao"]

              part1 = (
                  "No curso do processo administrativo, ficou demonstrado que o interessado era servidor titular de cargo efetivo e que "
                  f"{str(requirement['predicado']).rstrip('.')}; a verificação foi realizada por {str(protocol['responsavel']).rstrip('.')}, "
                  f"mediante {str(protocol['meio_de_prova']).rstrip('.')}, tendo sido exigida a seguinte evidência: "
                  f"{str(protocol['evidencia_exigida']).rstrip('.')}." + temporal(data)
              )

              devices = []
              for item in data.get("taxonomias", []):
                  devices.append(f"{citation(str(item['ref']))} {str(item['papel']).strip().rstrip('.')}.")
              part2 = "A hipótese e seus efeitos resultam da conjugação dos dispositivos aplicáveis. " + " ".join(devices)

              form_ref = f"/formas-calculo/{form_file}"
              form_data, _ = read_doc(Path("okf/formas-calculo") / form_file)
              sources = list(data.setdefault("proveniencia", {}).setdefault("fontes_consultadas", []))
              sources = [source for source in sources if not (isinstance(source, str) and source.startswith("/formas-calculo/"))]
              data["proveniencia"]["fontes_consultadas"] = [form_ref, *sources]

              projection = data["projecao"]
              integral = projection.get("integral") == "S"
              parity = projection.get("paridade") == "S"
              part3 = (
                  f"O cálculo inicial segue a forma “{form_data['nome']}”, vinculada a esta regra e sustentada pelos dispositivos articulados acima. "
                  + ("O resultado não sofre redução proporcional ao tempo. " if integral else "O resultado recebe a proporcionalização pelo tempo descrita nessa forma. ")
                  + ("Após a concessão, os proventos são revistos com paridade, segundo o dispositivo específico articulado acima. " if parity else "Após a concessão, o reajuste ocorre sem paridade, de acordo com o regime articulado acima. ")
                  + "Eventual parâmetro ainda indicado como pendente na forma de cálculo ou no corpo da regra não é antecipado por esta fundamentação."
              )

              field = "fundamentacao_integral" if integral else "fundamentacao_proporcional"
              projection.pop("fundamentacao_proporcional" if integral else "fundamentacao_integral", None)
              projection[field] = FoldedScalarString(f"{part1}\n\n{part2}\n\n{part3}")
              write_doc(rule_path, data, body)

          print(f"Authored {len(FORMS)} Cycle 1 rules")
          PY

      - name: Format and regenerate artifacts
        if: steps.author.outcome == 'success'
        continue-on-error: true
        run: |
          uv run python scripts/md_format.py okf docs README.md CLAUDE.md
          uv run python scripts/gerar_indices.py

      - name: Preserve diagnostic when authorship failed
        if: steps.author.outcome != 'success'
        run: |
          cp /tmp/author-cycle1.log docs/analysis/pr102-author-cycle1-error.log

      - name: Commit result and remove this temporary workflow
        if: always()
        run: |
          git rm .github/workflows/author-cycle1-fundamentacoes.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: aplica a RFC 0014 às 30 regras do Ciclo 1"
          git push origin HEAD:feat/fundamentacao-tres-partes
