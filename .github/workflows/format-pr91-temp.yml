name: Temporary format PR 91

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'cycle/1-operacionalizacao'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cycle/1-operacionalizacao
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
          enable-cache: true
      - run: uv sync --dev
      - run: uv run python scripts/md_format.py docs/spec/criterio-fechamento-ciclos.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spec/criterio-fechamento-ciclos.md
          git commit -m "style: format cycle closure criterion"
          git push origin HEAD:cycle/1-operacionalizacao
