name: Temporary format documentation

on:
  push:
    branches:
      - cycle/1-planejamento-incapacidade

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cycle/1-planejamento-incapacidade
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
          enable-cache: true
      - run: uv sync --dev
      - name: Format changed documentation
        run: >-
          uv run python scripts/md_format.py
          docs/analysis/leituras-provaveis-das-questoes-abertas.md
          docs/analysis/semantica-das-janelas-temporais.md
          docs/spec/README.md
          docs/spec/decisoes-semanticas-regra.md
          okf/regras-sisprev/achados/achado-0053.md
          okf/regras-sisprev/ciclos/ciclo-01.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/analysis/leituras-provaveis-das-questoes-abertas.md \
            docs/analysis/semantica-das-janelas-temporais.md \
            docs/spec/README.md \
            docs/spec/decisoes-semanticas-regra.md \
            okf/regras-sisprev/achados/achado-0053.md \
            okf/regras-sisprev/ciclos/ciclo-01.md
          git commit -m "style: format documentation"
          git push origin HEAD:cycle/1-planejamento-incapacidade
