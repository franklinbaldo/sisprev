name: PR 102 regenerate derived artifacts

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.number == 102 && github.head_ref == 'feat/fundamentacao-tres-partes'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/fundamentacao-tres-partes
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.7.19
      - name: Install dependencies
        run: uv sync --dev
      - name: Format, regenerate and validate
        run: |
          uv run python scripts/md_format.py okf docs README.md CLAUDE.md
          uv run python scripts/gerar_indices.py
          uv run python scripts/validar_regras.py
          uv run pytest
      - name: Commit generated result and remove this workflow
        run: |
          git rm .github/workflows/pr102-regenerate.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenera derivados após correção jurídica"
          git push origin HEAD:feat/fundamentacao-tres-partes
